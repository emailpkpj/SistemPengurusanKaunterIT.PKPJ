<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Portal Awam e-Kaunter PKPJ</title>
<style>
:root{--navy:#0a2949;--blue:#1769aa;--bg:#f3f6fa;--card:#fff;--text:#172033;--muted:#6b7788;--line:#dde6ef;--green:#16885a;--red:#c83b36;--shadow:0 12px 30px rgba(13,42,74,.09)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 12% 8%,rgba(49,134,214,.15),transparent 26%),radial-gradient(circle at 88% 12%,rgba(118,86,217,.10),transparent 24%),linear-gradient(180deg,#eef7ff 0,#f9fbff 38%,var(--bg) 100%);color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.wrap{min-height:100vh;padding:18px}.shell{max-width:790px;margin:auto}.head{text-align:center;padding:22px 0 20px}.logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(145deg,#0a2949,#1769aa);color:#fff;display:grid;place-items:center;font-weight:950;margin:0 auto 14px;box-shadow:0 16px 34px rgba(10,41,73,.22);letter-spacing:.04em}.title{font-size:29px;font-weight:950;color:var(--navy);margin-bottom:5px;letter-spacing:-.02em}.sub{color:#637286;line-height:1.5}.tabs{display:flex;justify-content:center;gap:9px;margin-bottom:18px}.tabs .btn{box-shadow:0 8px 20px rgba(23,105,170,.10)}.card{background:rgba(255,255,255,.94);border:1px solid rgba(224,234,243,.95);border-radius:24px;box-shadow:0 22px 50px rgba(13,42,74,.10);padding:24px;backdrop-filter:blur(10px)}.card-title{font-weight:950;font-size:15px;margin-bottom:13px;display:flex;justify-content:space-between;gap:10px}.grid{display:grid;gap:13px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.field{margin-bottom:13px}.field label{display:block;font-size:11px;color:#526173;font-weight:900;margin-bottom:6px}.req:after{content:" *";color:#d92d20}input,textarea{width:100%;border:1px solid #ced9e5;border-radius:10px;padding:10px 11px;background:#fff;color:#172033;outline:none}input:focus,textarea:focus{border-color:#6ba4d3;box-shadow:0 0 0 3px rgba(23,105,170,.08)}textarea{min-height:86px;resize:vertical}.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn-primary{background:linear-gradient(135deg,#1769aa,#0e5790);color:#fff}.btn-light{background:#f0f4f8;color:var(--navy);border:1px solid #dce5ee}.btn-green{background:var(--green);color:#fff}.btn-block{width:100%}.btn-sm{padding:7px 10px;font-size:11px}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.choice{position:relative;overflow:hidden;min-height:132px;padding:18px 18px 17px;border:1px solid rgba(216,228,240,.95);background:rgba(255,255,255,.92);border-radius:20px;text-align:left;box-shadow:0 10px 24px rgba(24,70,110,.07);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.choice:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--tone,#1769aa)}.choice:hover{transform:translateY(-3px);box-shadow:0 16px 30px rgba(24,70,110,.12);border-color:color-mix(in srgb,var(--tone,#1769aa) 38%,#dbe5ef)}.choice.active{border-color:var(--tone,#1769aa);box-shadow:0 0 0 3px color-mix(in srgb,var(--tone,#1769aa) 15%,transparent),0 15px 30px rgba(24,70,110,.12)}.choice-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;margin-bottom:13px;background:var(--tone-bg,#edf6ff);color:var(--tone,#1769aa);font-size:18px;font-weight:950;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}.choice b{display:block;color:var(--navy);margin-bottom:5px;font-size:15px;line-height:1.3}.choice span{font-size:10px;color:#708093}.tone-rose{--tone:#e05279;--tone-bg:#fff0f4}.tone-violet{--tone:#7656d9;--tone-bg:#f2efff}.tone-emerald{--tone:#15966b;--tone-bg:#eaf9f3}.tone-amber{--tone:#e28a14;--tone-bg:#fff6e8}.divider{height:1px;background:var(--line);margin:17px 0}.toolbar{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:15px}.notice{padding:12px 13px;border-radius:11px;background:#fff8e8;border:1px solid #f2deaa;color:#79580d;font-size:11px;line-height:1.5}.info{background:#edf6ff;border-color:#c9dfef;color:#285b80}.danger{background:#fff0ef;border-color:#f3ceca;color:#9e302c}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:10px}.doc{display:flex;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid #dfe7ef;border-radius:10px;background:#fafcfe;margin-top:7px}.success{text-align:center;padding:25px 16px}.check{width:68px;height:68px;border-radius:50%;background:#e8f8f0;color:#198754;display:grid;place-items:center;margin:0 auto 14px;font-size:32px;font-weight:950}.ref{background:#f4f8fc;border:1px dashed #9db6cb;border-radius:13px;padding:14px;margin:14px 0;font-size:20px;font-weight:950;color:var(--navy)}.status{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:950}.s-new{background:#fff2d8;color:#976100}.s-review{background:#e7f1ff;color:#245da7}.s-incomplete{background:#f2eaff;color:#6d3eb4}.s-updating{background:#e0f5f7;color:#137180}.s-done{background:#e6f7ef;color:#14734a}.s-reject{background:#fde9e8;color:#ad2d28}.loader{position:fixed;inset:0;background:rgba(255,255,255,.82);z-index:99;display:grid;place-items:center}.loader>div{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px 22px;box-shadow:var(--shadow);font-weight:900;color:var(--navy)}.spin{display:inline-block;width:17px;height:17px;border:3px solid #d9e6f1;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){.grid-2,.choice-grid{grid-template-columns:1fr}.wrap{padding:12px}.title{font-size:24px}.card{padding:17px;border-radius:19px}.choice{min-height:112px;padding:15px 15px 14px}.choice-icon{width:38px;height:38px;margin-bottom:10px}.head{padding-top:16px}}
</style>
</head>
<body>
<div id="root"></div>
<div id="loader" class="loader hidden"><div><span class="spin"></span><span id="loaderText">Memproses...</span></div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzmhN2oSMT8ZYUj-H_Wf9d3ci1U5TRsPOpw-tPyQcBRWFy_8zzURVAx1OwPiw-A5lHUJw/exec';
const UPLOAD_TOKEN=new URLSearchParams(location.search).get('upload')||'';
const PURPOSES=[
{id:'kahwin',name:'Pengemaskinian Status Perkahwinan',group:'Pengemaskinian Maklumat',icon:'♥',tone:'rose'},
{id:'pasangan',name:'Pengemaskinian Maklumat Pasangan',group:'Pengemaskinian Maklumat',icon:'👥',tone:'violet'},
{id:'pendapatan',name:'Pengemaskinian Pekerjaan / Pendapatan',group:'Pengemaskinian Maklumat',icon:'RM',tone:'emerald'},
{id:'lain',name:'Lain-lain Urusan',group:'Lain-lain',icon:'•••',tone:'amber'}];
const STATUS={new:['Baharu','s-new'],review:['Dalam Semakan','s-review'],incomplete:['Dokumen Tidak Lengkap','s-incomplete'],updating:['Sedang Dikemaskini','s-updating'],done:['Selesai','s-done'],reject:['Ditolak','s-reject']};
let CONFIG={maxFileBytes:4*1024*1024,maxFiles:5},STATE={purpose:''};
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
const purposeName=id=>PURPOSES.find(p=>p.id===id)?.name||id||'-';
function fmt(v){if(!v)return'-';try{return new Intl.DateTimeFormat('ms-MY',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(v))}catch{return v}}
function statusHTML(s){const o=STATUS[s]||[s||'-','s-new'];return `<span class="status ${o[1]}">${esc(o[0])}</span>`}
function showLoader(t){$('loaderText').textContent=t||'Memproses...';$('loader').classList.remove('hidden')}function hideLoader(){$('loader').classList.add('hidden')}
async function api(action,...args){const r=await fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,args})});if(!r.ok)throw new Error('API tidak dapat dihubungi. HTTP '+r.status);const raw=await r.text();let out;try{out=JSON.parse(raw)}catch{throw new Error('Sistem backend belum sedia. Sila maklumkan kepada pegawai kaunter.')}if(out.success===false)throw new Error(out.error||'Ralat API.');return out.success===true?out.data:out}
function shell(tab='form'){$('root').innerHTML=`<div class="wrap"><div class="shell"><div class="head"><div class="logo">PKPJ</div><div class="title">e-Kaunter PKPJ</div><div class="sub">Urusan pengemaskinian maklumat dan dokumen secara digital.</div></div><div class="tabs"><button class="btn ${tab==='form'?'btn-primary':'btn-light'} btn-sm" onclick="renderPublic('form')">Urusan Baharu</button><button class="btn ${tab==='status'?'btn-primary':'btn-light'} btn-sm" onclick="renderPublic('status')">Semak Status</button></div><div id="card" class="card"></div></div></div>`}
function renderPublic(tab='form'){shell(tab);if(tab==='status')renderStatus();else{STATE={purpose:''};step1()}}
function step1(){$('card').innerHTML=`<div class="card-title"><span>1. Pilih Tujuan Urusan</span><span class="small muted">Langkah 1/3</span></div><div class="choice-grid">${PURPOSES.map(p=>`<button class="choice tone-${p.tone} ${STATE.purpose===p.id?'active':''}" onclick="STATE.purpose='${p.id}';step1()"><div class="choice-icon">${esc(p.icon)}</div><b>${esc(p.name)}</b><span>${esc(p.group)}</span></button>`).join('')}</div><div class="divider"></div><div class="notice">Penghantaran melalui sistem ini tidak bermaksud pindaan telah diluluskan. Semua maklumat tertakluk kepada semakan pegawai PKPJ.</div><div class="toolbar" style="justify-content:flex-end"><button class="btn btn-primary" onclick="if(!STATE.purpose)return alert('Sila pilih tujuan urusan.');step2()">Seterusnya →</button></div>`}
function step2(){$('card').innerHTML=`<div class="card-title"><span>2. Maklumat Pemohon</span><span class="small muted">Langkah 2/3</span></div><div class="grid grid-2"><div class="field"><label class="req">No. Kad Pengenalan</label><input id="ic" inputmode="numeric"></div><div class="field"><label class="req">Nama Penuh</label><input id="name"></div><div class="field"><label class="req">No. Telefon</label><input id="phone" inputmode="tel"></div><div class="field"><label>No. Permohonan / No. Siri</label><input id="app"></div></div><div class="field"><label>Jenis Urusan</label><input value="${esc(purposeName(STATE.purpose))}" disabled></div><div class="grid grid-2"><div class="field"><label>Maklumat Lama / Semasa</label><textarea id="old"></textarea></div><div class="field"><label>Maklumat Baharu / Dimohon</label><textarea id="newv"></textarea></div></div><div class="field"><label>Catatan / Sebab</label><textarea id="note"></textarea></div><div class="toolbar"><button class="btn btn-light" onclick="step1()">← Kembali</button><button class="btn btn-primary" onclick="next2()">Seterusnya →</button></div>`;if(STATE.ic){$('ic').value=STATE.ic;$('name').value=STATE.name;$('phone').value=STATE.phone;$('app').value=STATE.appNo||'';$('old').value=STATE.oldValue||'';$('newv').value=STATE.newValue||'';$('note').value=STATE.note||''}}
function next2(){const ic=$('ic').value.trim(),name=$('name').value.trim(),phone=$('phone').value.trim();if(!ic||!name||!phone)return alert('Sila lengkapkan No. Kad Pengenalan, Nama dan No. Telefon.');STATE={...STATE,ic,name,phone,appNo:$('app').value.trim(),oldValue:$('old').value.trim(),newValue:$('newv').value.trim(),note:$('note').value.trim()};step3()}
function step3(){$('card').innerHTML=`<div class="card-title"><span>3. Dokumen & Pengesahan</span><span class="small muted">Langkah 3/3</span></div><div class="field"><label>Dokumen Sokongan</label><input id="docs" type="file" multiple accept=".pdf,.jpg,.jpeg,.png" onchange="preview(this)"><div class="tiny muted" style="margin-top:5px">Maksimum ${CONFIG.maxFiles} fail. Setiap fail maksimum ${Math.round(CONFIG.maxFileBytes/1024/1024)}MB. Gambar JPEG besar akan dikecilkan secara automatik untuk penghantaran lebih pantas.</div></div><div id="filelist"></div><div class="divider"></div><label style="display:flex;gap:9px;align-items:flex-start;font-size:11px;line-height:1.5"><input id="confirm" type="checkbox" style="width:auto;margin-top:3px"><span>Saya mengesahkan bahawa maklumat dan dokumen yang dikemukakan adalah benar dan boleh digunakan oleh PKPJ bagi tujuan semakan urusan ini.</span></label><div class="toolbar"><button class="btn btn-light" onclick="step2()">← Kembali</button><button class="btn btn-green" onclick="submitCase()">Hantar Permohonan</button></div>`}
function preview(inp){$('filelist').innerHTML=Array.from(inp.files||[]).map(f=>`<div class="doc"><b>📎 ${esc(f.name)}</b><span class="tiny muted">${(f.size/1024/1024).toFixed(1)}MB</span></div>`).join('')}
async function compressJpeg(file){if(file.type!=='image/jpeg'||file.size<1500000)return file;try{const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});const img=await new Promise((res,rej)=>{const x=new Image();x.onload=()=>res(x);x.onerror=rej;x.src=data});const max=2200,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',.88));return blob&&blob.size<file.size?new File([blob],file.name,{type:'image/jpeg'}):file}catch{return file}}
async function filesPayload(inp){const fs=Array.from(inp?.files||[]);if(fs.length>CONFIG.maxFiles)throw new Error(`Maksimum ${CONFIG.maxFiles} dokumen.`);const out=[];for(const original of fs){const f=await compressJpeg(original);if(f.size>CONFIG.maxFileBytes)throw new Error(`Fail ${original.name} masih melebihi had ${Math.round(CONFIG.maxFileBytes/1024/1024)}MB.`);if(!['application/pdf','image/jpeg','image/png'].includes(f.type))throw new Error(`Format tidak dibenarkan: ${original.name}`);const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(f)});out.push({name:original.name,mimeType:f.type,size:f.size,base64})}return out}
async function submitCase(){if(!$('confirm').checked)return alert('Sila tandakan pengesahan.');try{showLoader('Menghantar maklumat...');const docs=await filesPayload($('docs'));const r=await api('submitPublicCase',{...STATE,docs});$('card').innerHTML=`<div class="success"><div class="check">✓</div><h2>Maklumat Berjaya Dihantar</h2><p class="muted">Simpan nombor rujukan ini untuk semakan status.</p><div class="ref">${esc(r.ref)}</div><div class="small muted">${fmt(r.createdAt)}</div><div class="toolbar" style="justify-content:center"><button class="btn btn-primary" onclick="renderPublic('form')">Urusan Baharu</button><button class="btn btn-light" onclick="renderPublic('status')">Semak Status</button></div></div>`}catch(e){alert(e.message||e)}finally{hideLoader()}}
function renderStatus(){$('card').innerHTML=`<div class="card-title">Semakan Status Urusan</div><div class="field"><label class="req">No. Rujukan</label><input id="sref" placeholder="PKPJ-KTR-20260917-0001"></div><div class="field"><label class="req">No. Kad Pengenalan</label><input id="sic" inputmode="numeric"></div><button class="btn btn-primary btn-block" onclick="checkStatus()">Semak Status</button><div id="result" style="margin-top:14px"></div>`}
async function checkStatus(){try{showLoader('Menyemak status...');const r=await api('getPublicCaseStatus',$('sref').value.trim(),$('sic').value.trim()),c=r.case;$('result').innerHTML=`<div class="notice info"><b>${esc(c.ref)}</b><div style="margin-top:9px;display:grid;gap:7px"><div>Pemohon: <b>${esc(c.name)}</b></div><div>Jenis: <b>${esc(purposeName(c.purpose))}</b></div><div>Status: ${statusHTML(c.status)}</div><div>Kemaskini terakhir: <b>${fmt(c.updatedAt)}</b></div></div></div>`}catch(e){$('result').innerHTML=`<div class="notice danger">${esc(e.message||e)}</div>`}finally{hideLoader()}}
async function renderHybrid(tk){shell('form');document.querySelector('.tabs')?.remove();$('card').innerHTML='<div class="muted" style="text-align:center;padding:25px">Memuatkan maklumat kes...</div>';try{showLoader('Memeriksa QR...');const r=await api('getHybridCaseInfo',tk),c=r.case;$('card').innerHTML=`<div class="card-title">Muat Naik Dokumen</div><div class="grid grid-2"><div class="field"><label>Nama Pemohon</label><input value="${esc(c.name)}" disabled></div><div class="field"><label>No. Kad Pengenalan</label><input value="${esc(c.icMasked)}" disabled></div></div><div class="field"><label>No. Rujukan</label><input value="${esc(c.ref)}" disabled></div><div class="field"><label class="req">Pilih Dokumen</label><input id="hdocs" type="file" multiple accept=".pdf,.jpg,.jpeg,.png" onchange="previewHybrid(this)"><div class="tiny muted" style="margin-top:5px">QR tamat ${fmt(c.expiresAt)}.</div></div><div id="hlist"></div><button class="btn btn-green btn-block" style="margin-top:14px" onclick="submitHybrid('${esc(tk)}')">Hantar Dokumen</button>`}catch(e){$('card').innerHTML=`<div class="notice danger">${esc(e.message||e)}</div>`}finally{hideLoader()}}
function previewHybrid(inp){$('hlist').innerHTML=Array.from(inp.files||[]).map(f=>`<div class="doc"><b>📎 ${esc(f.name)}</b><span class="tiny muted">${(f.size/1024/1024).toFixed(1)}MB</span></div>`).join('')}
async function submitHybrid(tk){try{showLoader('Memuat naik dokumen...');const docs=await filesPayload($('hdocs'));if(!docs.length)throw new Error('Pilih sekurang-kurangnya satu dokumen.');const r=await api('submitHybridDocuments',tk,docs);$('card').innerHTML=`<div class="success"><div class="check">✓</div><h2>Dokumen Berjaya Dihantar</h2><p class="muted">${r.count} dokumen dilampirkan kepada ${esc(r.ref)}.</p></div>`}catch(e){alert(e.message||e)}finally{hideLoader()}}
function boot(){if(UPLOAD_TOKEN)renderHybrid(UPLOAD_TOKEN);else renderPublic('form');api('getClientConfig').then(c=>CONFIG={...CONFIG,...c}).catch(()=>{})}
boot();
</script>
</body>
</html>
