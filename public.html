<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b3159">
<title>Portal Awam • e-Kaunter PKPJ</title>
<style>
:root{--navy:#0b3159;--dark:#0a2545;--blue:#2375bc;--aqua:#21b6c4;--gold:#f1c44e;--ink:#1e3350;--muted:#75849a;--line:#dce6f1;--bg:#f4f8fd;--shadow:0 16px 43px rgba(16,56,94,.10);--radius:20px}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e8f3ff 0,#f7fbff 45%,#f0f5fb 100%);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}img{display:block;max-width:100%}a{color:inherit;text-decoration:none}.hidden{display:none!important}
.container{max-width:1050px;margin:0 auto;padding:24px 20px 42px}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.nav-brand{display:flex;align-items:center;gap:12px}.nav-logo{width:66px;height:66px;border-radius:18px;padding:9px;object-fit:contain;background:white;box-shadow:0 9px 23px #14395818}.nav-brand strong{color:var(--navy);font-size:19px;display:block;letter-spacing:-.03em}.nav-brand span{font-size:11px;color:#70839a;display:block;margin-top:3px}.nav-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:none;border-radius:12px;padding:12px 18px;font-weight:750;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s}.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #55a3e680;outline-offset:2px}.btn-primary{background:linear-gradient(135deg,#2079bd,#135da3);color:white;box-shadow:0 8px 15px #146db124}.btn-primary:hover{transform:translateY(-2px)}.btn-light{border:1px solid var(--line);background:white;color:var(--navy)}.btn-gold{background:linear-gradient(135deg,#f5d469,#e7b23f);color:var(--navy)}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}.btn-small{padding:9px 13px;font-size:12px}
.hero{position:relative;background:linear-gradient(126deg,#0c3562,#124e86 57%,#1878ad);border-radius:27px;min-height:170px;padding:26px 31px;color:#fff;box-shadow:0 20px 42px #0a36622b;overflow:hidden}.hero:before,.hero:after{content:'';position:absolute;pointer-events:none;border-radius:50%;border:1px solid #ffffff14}.hero:before{width:320px;height:320px;right:-75px;top:-150px;background:radial-gradient(circle,#76d3ff22,transparent 65%)}.hero:after{width:160px;height:160px;right:145px;bottom:-100px}.hero-kicker{font-size:10px;letter-spacing:.16em;font-weight:800;color:#c5e5ff}.hero h1{font-size:clamp(25px,4vw,36px);line-height:1.15;margin:11px 0 9px;letter-spacing:-.04em}.hero p{color:#d3e7f7;font-size:13px;max-width:650px;line-height:1.65;margin:0}.counter-tag{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 13px;background:#fff2;border:1px solid #fff4;font-size:12px;font-weight:700;margin-top:14px}.counter-tag b{color:#ffe083}
.main-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:23px;margin-top:18px;padding:27px;box-shadow:var(--shadow)}.stepper{display:flex;gap:10px;align-items:center;margin-bottom:24px}.step{flex:1;display:flex;align-items:center;gap:9px;color:#98a7b8;font-size:11px;font-weight:760}.step:not(:last-child):after{content:'';flex:1;height:2px;background:#e8eff7;margin-left:5px}.step .num{min-width:31px;height:31px;display:grid;place-items:center;border-radius:11px;background:#edf2f8;color:#91a2b4}.step.active{color:#0c4b80}.step.active .num{background:linear-gradient(135deg,#277fc3,#1a66b0);color:white;box-shadow:0 7px 14px #257bb322}.step.done .num{background:#e9f6ee;color:#13844c}.step.done:after{background:#c0dfe4}
h2{font-size:23px;letter-spacing:-.035em;color:var(--navy);margin:0 0 6px}.desc{font-size:13px;color:var(--muted);margin:0 0 20px;line-height:1.6}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.choice{position:relative;display:flex;align-items:center;gap:13px;min-height:100px;border:1px solid #dce6f1;border-radius:17px;background:white;text-align:left;padding:17px;transition:.2s}.choice:before{content:'';position:absolute;top:0;bottom:0;left:0;width:4px;background:var(--accent,#2a83cd);border-radius:16px 0 0 16px}.choice:hover{background:#f8fcff;border-color:#9bc6ea;transform:translateY(-2px)}.choice.selected{background:#eef7ff;border-color:var(--accent,#2a83cd);box-shadow:0 0 0 2px #208bd414}.choice-icon{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;background:var(--soft,#edf6ff);font-size:24px}.choice strong{display:block;font-size:15px;color:var(--navy)}.choice small{display:block;color:#788ba0;margin-top:4px;font-size:11px;line-height:1.4}.choice-check{margin-left:auto;align-self:flex-start;font-size:18px;color:#1a79bc;visibility:hidden}.choice.selected .choice-check{visibility:visible}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#455d75;font-weight:750;display:block;margin-bottom:7px}.field label.required:after{content:' *';color:#da5347}.field input,.field textarea{border-radius:11px;border:1px solid #d4e0ec;padding:12px 13px;width:100%;outline:none;color:#20364c;background:#fff;font-size:13px}.field input:focus,.field textarea:focus{border-color:#79b6e5;box-shadow:0 0 0 3px #237fc011}.field textarea{min-height:90px;resize:vertical}.field .help{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}.divider{border:0;border-top:1px solid var(--line);margin:22px 0}.actions{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:23px}.note{font-size:11px;color:#805f1e;background:#fff9eb;border:1px solid #f1dfbb;padding:12px 14px;border-radius:12px;line-height:1.6}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary-item{border:1px solid #e5edf4;background:#f8fbfe;border-radius:12px;padding:11px 13px}.summary-item span{display:block;color:#7b8ba0;font-size:11px}.summary-item strong{display:block;font-size:13px;color:var(--navy);margin-top:5px;overflow-wrap:anywhere}
.upload-actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.upload-btn{display:inline-flex;align-items:center;gap:10px;padding:13px 18px;border-radius:13px;background:#eff7ff;border:1px dashed #8cbfe6;color:#175b91;font-size:13px;font-weight:790;cursor:pointer}.upload-btn.camera{background:#fff8e6;border-color:#ead092;color:#836013}.photo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-height:410px;overflow:auto}.photo{position:relative;background:#fafcfe;border:1px solid var(--line);border-radius:14px;overflow:hidden;padding-bottom:9px}.photo img{width:100%;height:110px;object-fit:cover}.photo .file-icon{height:110px;display:grid;place-items:center;color:#175b91;background:#edf6ff;font-size:35px}.photo .name{display:block;font-size:10px;font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 9px 0}.photo .size{display:block;color:#8392a4;font-size:10px;padding:3px 9px}.photo .remove{position:absolute;right:7px;top:7px;border:0;border-radius:50%;width:27px;height:27px;background:#102e4ddf;color:#fff}.photo .uploaded{position:absolute;top:7px;left:7px;background:#0f945c;color:#fff;border-radius:99px;font-size:10px;padding:5px 8px}.progress-wrap{background:#edf2f8;border-radius:999px;height:10px;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#1c7fca,#28beb9);border-radius:999px;transition:width .2s}.progress-label{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:#6e7f93;margin:11px 0 8px}.center{text-align:center}.success-icon{display:grid;place-items:center;font-size:31px;color:#168253;width:68px;height:68px;border-radius:50%;margin:0 auto 12px;background:#e9f8ef}.reference{margin:18px 0;padding:17px;border-radius:15px;border:1px dashed #a9bfd5;background:#f4f8fc;font-size:22px;font-weight:860;color:var(--navy);overflow-wrap:anywhere}.status-pill{display:inline-flex;border-radius:999px;padding:7px 13px;background:#e8f4fe;color:#175d93;font-size:12px;font-weight:800}.error{padding:13px;border-radius:12px;background:#fff0ef;border:1px solid #f2c9c6;color:#993434;font-size:12px;line-height:1.55}.good{padding:13px;border-radius:12px;background:#edf9f1;border:1px solid #caebd4;color:#126b40;font-size:12px;line-height:1.55}.foot{text-align:center;color:#8493a5;font-size:11px;margin-top:24px}
@media(max-width:760px){.container{padding:12px 12px 28px}.nav{margin-bottom:12px}.nav-logo{width:51px;height:51px;border-radius:14px}.nav-brand strong{font-size:16px}.nav-actions{gap:5px}.nav-actions .btn{padding:9px 12px;font-size:11px}.hero{padding:22px 18px;border-radius:20px;min-height:170px}.main-card{padding:18px 14px;border-radius:19px}.stepper{gap:3px}.step .num{width:29px;height:29px;min-width:29px}.step small{display:none}.step:not(:last-child):after{margin-left:0}.choice-grid,.fields,.summary{grid-template-columns:1fr}.choice{min-height:86px}.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.photo img,.photo .file-icon{height:125px}.actions .btn{flex:1;min-width:115px}.upload-actions .upload-btn{flex:1;justify-content:center}}
</style>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzmhN2oSMT8ZYUj-H_Wf9d3ci1U5TRsPOpw-tPyQcBRWFy_8zzURVAx1OwPiw-A5lHUJw/exec';
const AM_SERVICES=[
 {id:'bumiputera',title:'Urusan Bumiputera',desc:'Permohonan dan pertanyaan urusan Bumiputera',icon:'🏛️',accent:'#2185cb',soft:'#e8f4ff'},
 {id:'pindahmilik',title:'Pindah Milik',desc:'Urusan pindah milik / pertukaran pemilikan',icon:'🔁',accent:'#8f69dc',soft:'#f3eefe'},
 {id:'rmmj',title:'RMMJ',desc:'Rumah Mampu Milik Johor',icon:'🏡',accent:'#16977e',soft:'#e7f9f3'},
 {id:'maklumat',title:'Kemaskini Maklumat Peribadi',desc:'Pembetulan atau perubahan maklumat pemohon',icon:'🪪',accent:'#d68c28',soft:'#fff4e4'},
 {id:'lain',title:'Lain-lain Urusan',desc:'Pertanyaan, dokumen dan urusan tambahan',icon:'📋',accent:'#4270b5',soft:'#ecf3ff'}
];
const IT_SERVICES=[
 {id:'it_peranti',title:'Aduan Peralatan / Peranti',desc:'Masalah komputer, pencetak atau aksesori ICT',icon:'💻',accent:'#2185cb',soft:'#e8f4ff'},
 {id:'it_sistem',title:'Sokongan Sistem / Akaun',desc:'Bantuan sistem, sambungan atau akaun',icon:'🛠️',accent:'#8f69dc',soft:'#f3eefe'},
 {id:'it_lain',title:'Lain-lain Urusan IT',desc:'Urusan teknikal dan pertanyaan lain',icon:'📡',accent:'#16977e',soft:'#e7f9f3'}
];
const ALL_SERVICES=[...AM_SERVICES,...IT_SERVICES];
const params=new URLSearchParams(location.search);
const counter=params.get('counter')==='IT'?'IT':'AM';
const fixedPurpose=params.get('purpose')||'';
const UPLOAD_TOKEN=params.get('upload')||'';
let form={purpose:'',name:'',ic:'',phone:'',appNo:'',address:'',oldValue:'',newValue:'',note:'',confirm:false,submissionId:'',caseRef:'',caseToken:'',createdAt:''};
let photos=[];let currentStep=1;let busy=false;let statusData=null;let statusView=false;let hybridView=false;
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const prettyBytes=n=>(n/1024/1024).toFixed(2)+' MB';
const services=()=>counter==='IT'?IT_SERVICES:AM_SERVICES;
const serviceName=id=>(ALL_SERVICES.find(s=>s.id===id)||{title:'Lain-lain Urusan'}).title;
const statusLabels={new:'Baharu',review:'Dalam Semakan',incomplete:'Dokumen Tidak Lengkap',updating:'Sedang Dikemaskini',done:'Selesai',reject:'Ditolak'};
function randomId(){return (self.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)}
function showError(message){const x=$('errorArea');if(x){x.innerHTML='<div class="error">'+esc(message)+'</div>'; x.scrollIntoView({behavior:'smooth',block:'nearest'});}else alert(message)}
function setBusy(v){busy=v;document.querySelectorAll('[data-submit]').forEach(b=>b.disabled=v)}
async function api(action,...args){const res=await fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,args})});if(!res.ok)throw Error('Sambungan API gagal ('+res.status+').');let parsed;try{parsed=await res.json()}catch(_){throw Error('Backend tidak memulangkan JSON. Semak Deployment Apps Script.')}if(parsed.success===false)throw Error(parsed.error||'Ralat sambungan');return parsed.data??parsed;}
function stepbar(step){return `<div class="stepper">${[1,2,3].map((n)=>`<div class="step ${step===n?'active':''} ${step>n?'done':''}"><span class="num">${step>n?'✓':n}</span><small>${['Pilih Urusan','Maklumat Pemohon','Dokumen & Hantar'][n-1]}</small></div>`).join('')}</div>`}
function gotoStep(step){currentStep=step;statusView=false;hybridView=false;if(step===1)renderStep1();else if(step===2)renderStep2();else renderStep3();window.scrollTo({top:0,behavior:'smooth'});}
function renderStep1(){const p=services();$('content').innerHTML=stepbar(1)+`<h2>Pilih Tujuan Urusan</h2><p class="desc">Sila pilih kategori yang berkaitan. Tekan butang <b>Seterusnya</b> untuk mengisi maklumat pada halaman kedua.</p><div class="choice-grid">${p.map(s=>`<button class="choice ${form.purpose===s.id?'selected':''}" style="--accent:${s.accent};--soft:${s.soft}" onclick="selectService('${s.id}')"><span class="choice-icon">${s.icon}</span><span><strong>${s.title}</strong><small>${s.desc}</small></span><span class="choice-check">✓</span></button>`).join('')}</div><div class="actions"><span class="note">Pilihan urusan boleh ditukar sebelum borang dihantar.</span><button class="btn btn-primary" onclick="nextTo2()">Seterusnya <span>→</span></button></div><div id="errorArea"></div>`;}
function selectService(id){form.purpose=id;renderStep1()}
function nextTo2(){if(!form.purpose)return showError('Sila pilih urusan terlebih dahulu.');gotoStep(2)}
function renderStep2(){$('content').innerHTML=stepbar(2)+`<h2>Maklumat Pemohon</h2><p class="desc">Isikan butiran pemohon, isu yang dihadapi dan maklumat yang hendak dikemaskini.</p><div class="fields"><div class="field"><label class="required" for="ic">No. Kad Pengenalan</label><input id="ic" value="${esc(form.ic)}" inputmode="numeric" placeholder="Contoh: 840201055155" autocomplete="off"></div><div class="field"><label class="required" for="name">Nama Penuh</label><input id="name" value="${esc(form.name)}" placeholder="Seperti dalam kad pengenalan" autocomplete="name"></div><div class="field"><label class="required" for="phone">No. Telefon</label><input id="phone" value="${esc(form.phone)}" placeholder="Contoh: 0123456789" inputmode="tel" autocomplete="tel"></div><div class="field full"><label class="required" for="oldValue">Isu</label><textarea id="oldValue" placeholder="Huraikan isu anda berkaitan urusan ${esc(serviceName(form.purpose))}">${esc(form.oldValue)}</textarea><div class="help">Terangkan isu untuk membantu petugas mengenal pasti tindakan yang diperlukan.</div></div><div class="field full"><label for="newValue">Maklumat yang Hendak Dikemaskini</label><textarea id="newValue" placeholder="Nyatakan maklumat yang hendak dikemaskini atau tindakan yang dimohon">${esc(form.newValue)}</textarea></div><div class="field full"><label for="note">Catatan Tambahan</label><textarea id="note" placeholder="Penjelasan tambahan (pilihan)">${esc(form.note)}</textarea></div></div><div id="errorArea"></div><div class="actions"><button class="btn btn-light" onclick="saveStep2();gotoStep(1)">← Kembali</button><button class="btn btn-primary" onclick="nextTo3()">Seterusnya <span>→</span></button></div>`;}
function saveStep2(){['ic','name','phone','oldValue','newValue','note'].forEach(k=>{if($(k))form[k]=$(k).value.trim()})}
function nextTo3(){saveStep2();form.ic=form.ic.replace(/[\s-]/g,'');form.phone=form.phone.replace(/[\s-]/g,'');if(!form.ic||!form.name||!form.phone||!form.oldValue)return showError('Lengkapkan nombor kad pengenalan, nama, telefon dan Isu.');if(!/^[0-9]{12}$/.test(form.ic))return showError('No. Kad Pengenalan perlu mengandungi 12 angka.');if(!/^[0-9+]{9,14}$/.test(form.phone))return showError('Semak nombor telefon yang dimasukkan.');gotoStep(3)}
function filePickerMarkup(){return `<div class="upload-actions"><label class="upload-btn camera" for="cameraInput">📷 Buka Kamera</label><label class="upload-btn" for="galleryInput">＋ Tambah Gambar / Fail</label></div><p class="desc" style="margin-bottom:12px">Ambil gambar berkali-kali, tiada had bilangan gambar dalam borang. Gambar akan dihantar <b>satu demi satu</b>. Fail imej disesuaikan saiz secara automatik untuk penghantaran.</p><div id="photoGrid" class="photo-grid"></div>`}
function renderStep3(){$('content').innerHTML=stepbar(3)+`<h2>Dokumen & Pengesahan</h2><p class="desc">Semak butiran anda dan tambah seberapa banyak gambar sokongan yang diperlukan sebelum menghantar.</p><div class="summary"><div class="summary-item"><span>Kaunter</span><strong>${counter}</strong></div><div class="summary-item"><span>Jenis Urusan</span><strong>${esc(serviceName(form.purpose))}</strong></div><div class="summary-item"><span>Nama Pemohon</span><strong>${esc(form.name)}</strong></div><div class="summary-item"><span>No. Kad Pengenalan</span><strong>${esc(form.ic.slice(0,6)+'******')}</strong></div></div><hr class="divider"><h2 style="font-size:18px">Lampiran / Gambar Sokongan</h2>${filePickerMarkup()}<div class="note" style="margin-top:12px">Format diterima: JPG, PNG dan PDF. Had teknikal <b>setiap fail</b> ialah 4 MB selepas pemampatan; bilangan gambar tidak dihadkan oleh borang.</div><hr class="divider"><label style="display:flex;gap:10px;align-items:flex-start;font-size:12px;color:#51647b"><input type="checkbox" id="consent" ${form.confirm?'checked':''} style="width:17px;height:17px;margin:1px 0 0" onchange="form.confirm=this.checked"><strong style="font-weight:750;color:#153354">Saya mengesahkan maklumat yang dikemukakan adalah benar dan membenarkan PKPJ membuat semakan bagi urusan ini.</strong></label><div id="uploadProgress" class="hidden"><div class="progress-label"><span id="progressText">Menyediakan...</span><span id="progressPct">0%</span></div><div class="progress-wrap"><div class="progress-fill" id="progressBar"></div></div></div><div id="errorArea" style="margin-top:14px"></div><div class="actions"><button class="btn btn-light" onclick="gotoStep(2)">← Kembali</button><button class="btn btn-primary" data-submit onclick="submitPublic()">Hantar Permohonan →</button></div>`;renderPhotos();}
function renderPhotos(){const grid=$('photoGrid');if(!grid)return;grid.innerHTML=photos.length?photos.map((p,i)=>`<div class="photo">${p.preview?`<img src="${p.preview}" alt="Pratonton gambar">`:'<div class="file-icon">📄</div>'}${p.uploaded?'<span class="uploaded">✓ dihantar</span>':''}<button class="remove" title="Buang" onclick="removeFile('${p.id}')" ${p.uploaded?'disabled':''}>×</button><span class="name">${esc(p.file.name)}</span><span class="size">${prettyBytes(p.file.size)}</span></div>`).join(''):'<div class="note" style="grid-column:1/-1">Belum ada gambar. Dokumen sokongan adalah pilihan.</div>'}
function addFiles(fileList,source){for(const file of Array.from(fileList||[])){const ext=file.type;if(!file.type.startsWith('image/')&&file.type!=='application/pdf')continue;photos.push({id:randomId(),file,preview:file.type.startsWith('image/')?URL.createObjectURL(file):'',uploaded:false,source});}if(source==='kamera')$('cameraInput').value='';else $('galleryInput').value='';renderPhotos();}
function removeFile(id){const i=photos.findIndex(x=>x.id===id);if(i<0||photos[i].uploaded)return;if(photos[i].preview)URL.revokeObjectURL(photos[i].preview);photos.splice(i,1);renderPhotos();}
async function optimizeFile(file){const maxBytes=3.4*1024*1024; if(!file.type.startsWith('image/')){if(file.size>4*1024*1024)throw Error(file.name+' terlalu besar. Pilih PDF kurang 4MB.');return file;}if(file.size<=maxBytes && file.type==='image/jpeg')return file;let img;try{img=await createImageBitmap(file)}catch(e){if(file.size<=4*1024*1024)return file;throw Error('Tidak dapat proses gambar '+file.name)}const maxDim=1900;const scale=Math.min(1,maxDim/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);img.close&&img.close();let blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.82));if(!blob)throw Error('Gambar gagal diproses.');let quality=.72;while(blob.size>maxBytes&&quality>.44){blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));quality-=.1;}if(blob.size>4*1024*1024)throw Error('Gambar '+file.name+' melebihi had selepas dikecilkan.');return new File([blob],file.name.replace(/\.[^.]+$/, '')+'.jpg',{type:'image/jpeg',lastModified:Date.now()});}
async function payloadFor(photo){const f=await optimizeFile(photo.file);const raw=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(Error('Tidak dapat membaca gambar.'));reader.readAsDataURL(f);});return{name:f.name,mimeType:f.type,size:f.size,base64:raw,clientUploadId:photo.id};}
function updateProgress(current,total,message){const wrap=$('uploadProgress');if(!wrap)return;wrap.classList.remove('hidden');const pct=total===0?100:Math.round(current/total*100);$('progressText').textContent=message||`Gambar ${current} daripada ${total}`;$('progressPct').textContent=pct+'%';$('progressBar').style.width=pct+'%';}
async function submitPublic(){if(busy)return;const consent=$('consent');form.confirm=!!consent?.checked;if(!form.confirm)return showError('Sila tandakan pengesahan maklumat terlebih dahulu.');setBusy(true);try{if(!form.submissionId)form.submissionId=randomId();if(!form.caseRef){updateProgress(0,photos.length,'Menyimpan rekod permohonan...');const result=await api('submitPublicCase',{counter,purpose:form.purpose,ic:form.ic,name:form.name,phone:form.phone,appNo:'',oldValue:form.oldValue,newValue:form.newValue,note:form.note,clientSubmissionId:form.submissionId,docs:[]});form.caseRef=result.ref;form.caseToken=result.uploadToken;form.createdAt=result.createdAt;}if(photos.length&&!form.caseToken)throw Error('Token muat naik tiada. Sila hubungi petugas kaunter dengan nombor rujukan '+form.caseRef);for(let i=0;i<photos.length;i++){if(photos[i].uploaded){updateProgress(photos.filter(p=>p.uploaded).length,photos.length);continue;}updateProgress(photos.filter(p=>p.uploaded).length,photos.length,'Sedang muat naik gambar '+(i+1)+' / '+photos.length);await api('submitHybridDocuments',form.caseToken,[await payloadFor(photos[i])]);photos[i].uploaded=true;renderPhotos();updateProgress(photos.filter(p=>p.uploaded).length,photos.length);}renderSuccess();}catch(e){showError((e.message||e)+' Jika rekod sudah dijana, tekan Hantar semula untuk sambung gambar yang belum selesai.');}finally{setBusy(false);}}
function renderSuccess(){$('content').innerHTML=`<div class="center"><div class="success-icon">✓</div><h2>Permohonan Berjaya Dihantar</h2><p class="desc">Sila simpan nombor rujukan untuk semakan status urusan anda.</p><div class="reference">${esc(form.caseRef)}</div><div class="good">${photos.filter(p=>p.uploaded).length} dokumen / gambar telah berjaya dihantar ke sistem.</div><div class="actions" style="justify-content:center"><button class="btn btn-primary" onclick="showStatus('${esc(form.caseRef)}')">Semak Status</button><button class="btn btn-light" onclick="startNew()">Urusan Baharu</button></div></div>`;}
function startNew(){if(busy)return;photos.forEach(p=>{if(p.preview)URL.revokeObjectURL(p.preview)});photos=[];form={purpose:'',name:'',ic:'',phone:'',appNo:'',address:'',oldValue:'',newValue:'',note:'',confirm:false,submissionId:'',caseRef:'',caseToken:'',createdAt:''};gotoStep(1)}
function showStatus(ref=''){$('content').innerHTML=`<h2>Semakan Status Urusan</h2><p class="desc">Masukkan nombor rujukan dan kad pengenalan untuk melihat status terkini.</p><div class="fields"><div class="field"><label class="required">Nombor Rujukan</label><input id="statusRef" placeholder="PKPJ-KTR-YYYYMMDD-0001" value="${esc(ref)}"></div><div class="field"><label class="required">No. Kad Pengenalan</label><input id="statusIC" inputmode="numeric"></div></div><div class="actions"><button class="btn btn-light" onclick="gotoStep(1)">← Kembali</button><button class="btn btn-primary" onclick="checkStatus()">Semak Status</button></div><div id="statusResult" style="margin-top:15px"></div>`;}
async function checkStatus(){const target=$('statusResult');try{target.innerHTML='<div class="note">Sedang menyemak status...</div>';const r=await api('getPublicCaseStatus',$('statusRef').value.trim(),$('statusIC').value.trim());const c=r.case;target.innerHTML=`<div class="summary"><div class="summary-item"><span>No. Rujukan</span><strong>${esc(c.ref)}</strong></div><div class="summary-item"><span>Nama Pemohon</span><strong>${esc(c.name)}</strong></div><div class="summary-item"><span>Urusan</span><strong>${esc(serviceName(c.purpose))}</strong></div><div class="summary-item"><span>Kaunter Semasa</span><strong>Kaunter ${esc(c.counter||'AM')}</strong></div></div><div class="good" style="margin-top:12px"><span class="status-pill">${esc(statusLabels[c.status]||c.status)}</span> · Kemaskini ${esc(c.updatedAt||'-')}</div>`;}catch(e){target.innerHTML='<div class="error">'+esc(e.message||e)+'</div>'}}
async function showHybrid(){hybridView=true;$('heroTitle').textContent='Muat Naik Dokumen';$('content').innerHTML='<div class="note">Memuatkan maklumat rujukan...</div>';try{const r=await api('getHybridCaseInfo',UPLOAD_TOKEN);const c=r.case;form.caseRef=c.ref;form.caseToken=UPLOAD_TOKEN;$('content').innerHTML=`<h2>Tambah Dokumen kepada Urusan</h2><p class="desc">Rujukan <b>${esc(c.ref)}</b> • ${esc(c.name)}. Pautan tamat <b>${esc(c.expiresAt)}</b>.</p>${filePickerMarkup()}<div id="uploadProgress" class="hidden"><div class="progress-label"><span id="progressText">Memuat naik...</span><span id="progressPct">0%</span></div><div class="progress-wrap"><div class="progress-fill" id="progressBar"></div></div></div><div id="errorArea" style="margin-top:14px"></div><div class="actions"><button class="btn btn-primary" data-submit onclick="submitHybridFiles()">Hantar Dokumen</button></div>`;renderPhotos();}catch(e){$('content').innerHTML='<div class="error">'+esc(e.message||e)+'</div>'}}
async function submitHybridFiles(){if(busy)return;if(!photos.some(p=>!p.uploaded))return showError('Sila ambil gambar atau pilih dokumen terlebih dahulu.');setBusy(true);try{for(let i=0;i<photos.length;i++){if(photos[i].uploaded)continue;updateProgress(photos.filter(p=>p.uploaded).length,photos.length,'Sedang muat naik gambar '+(i+1)+' / '+photos.length);await api('submitHybridDocuments',form.caseToken,[await payloadFor(photos[i])]);photos[i].uploaded=true;updateProgress(photos.filter(p=>p.uploaded).length,photos.length);renderPhotos();}$('content').innerHTML=`<div class="center"><div class="success-icon">✓</div><h2>Dokumen Berjaya Dihantar</h2><p class="desc">${photos.length} gambar / dokumen dilampirkan kepada rujukan ${esc(form.caseRef)}.</p><button class="btn btn-light" onclick="location.reload()">Tutup</button></div>`;}catch(e){showError((e.message||e)+' Sila cuba lagi untuk gambar yang belum selesai.');}finally{setBusy(false)}}
function boot(){if(counter==='IT'){document.title='Portal Awam Kaunter IT · PKPJ';$('heroTitle').textContent='Kaunter IT';$('heroDesc').textContent='Bantuan IT dan sokongan sistem. Pilih urusan dan lengkapkan tiga langkah.';$('counterName').textContent='Portal Kaunter IT';}if(counter==='AM')document.title='Portal Awam Kaunter AM · PKPJ';if(UPLOAD_TOKEN){showHybrid();return;}if(services().some(s=>s.id===fixedPurpose))form.purpose=fixedPurpose;gotoStep(1);}
boot();
</script>
