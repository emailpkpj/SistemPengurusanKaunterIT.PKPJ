<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>e-Kaunter PKPJ · Portal Awam</title>
<style>
:root{--navy:#0d2f57;--blue:#1973c9;--cyan:#3eb1d1;--gold:#f0c540;--bg:#eef6fc;--card:#fff;--text:#142131;--muted:#687a8e;--line:#dbe7f0;--shadow:0 18px 40px rgba(13,47,87,.10);--radius:22px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#eaf4ff 0,#f6fbff 32%,#f4f8fc 100%);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none}img{max-width:100%;display:block}
.wrap{min-height:100vh;padding:24px}.shell{max-width:980px;margin:0 auto}.hero{text-align:center;padding:18px 0 22px}.logo{width:96px;height:96px;margin:0 auto 14px;object-fit:contain;background:#fff;border-radius:24px;padding:10px;box-shadow:var(--shadow)}h1{margin:0;font-size:42px;color:var(--navy)}.sub{color:var(--muted);max-width:760px;margin:10px auto 0;line-height:1.6}
.top-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}.btn:hover{transform:translateY(-1px)}.btn-primary{background:linear-gradient(135deg,var(--blue),#0f5ea8);color:#fff}.btn-light{background:#fff;color:var(--navy);border:1px solid var(--line)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}.steps{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:#8090a1;margin-bottom:16px;flex-wrap:wrap}.steps b{color:var(--navy)}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;font-size:16px;font-weight:900;color:var(--navy)}
.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.choice{padding:18px;border-radius:18px;border:1px solid var(--line);background:#fff;text-align:left;transition:.15s}.choice:hover{border-color:#8cc0eb}.choice.active{border-color:var(--blue);background:#edf6ff;box-shadow:0 0 0 3px rgba(25,115,201,.08)}.choice b{display:block;color:var(--navy);font-size:18px;margin-bottom:5px}.choice span{font-size:12px;color:#718294;line-height:1.5}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.field label{display:block;font-size:12px;font-weight:900;color:#506176;margin-bottom:7px}.req::after{content:' *';color:#d92d20}input,select,textarea{width:100%;border:1px solid #cfdbeb;border-radius:13px;padding:12px 13px;background:#fff;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:#77b3e3;box-shadow:0 0 0 3px rgba(25,115,201,.08)}textarea{min-height:96px;resize:vertical}input[type=file]{padding:8px;background:#f8fbfe}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.notice{padding:13px 14px;border-radius:14px;font-size:12px;line-height:1.6}.info{background:#edf7ff;border:1px solid #cfe1f1;color:#2b5d84}.warn{background:#fff8e9;border:1px solid #efddb2;color:#845f00}.success{background:#edf9f1;border:1px solid #c5e7d2;color:#166b41}.danger{background:#fff0ef;border:1px solid #efcccc;color:#a13333}
.doc-list{display:grid;gap:10px}.doc{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fbfdff}.ref{padding:16px;border-radius:18px;border:1px dashed #9ab7d4;background:#f5f9fe;color:var(--navy);font-size:23px;font-weight:900;text-align:center;margin:14px 0}
.bottom-links{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}.pill{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--navy);font-size:12px;font-weight:800}
@media (max-width:760px){.wrap{padding:14px}h1{font-size:32px}.g2,.choice-grid{grid-template-columns:1fr}.logo{width:84px;height:84px}}

/* PREMIUM 2026 - kemas kini visual sahaja, tanpa mengubah API dan rekod. */
:root{--navy:#10385f;--blue:#1c70bb;--bg:#f5f8fc;--line:#e3eaf3;--shadow:0 12px 36px rgba(24,65,103,.075);--radius:19px}
body{font-family:Inter,"Segoe UI",Arial,sans-serif!important;letter-spacing:0;font-weight:400;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit!important}
button,.btn,.nav-btn,.top-pill,.choice{transition:background-color .2s,border-color .2s,box-shadow .2s,transform .2s}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(32,136,218,.40);outline-offset:2px}

body{background:linear-gradient(165deg,#eaf3fc 0,#f5f9fe 45%,#f6f8fb 100%)}
.wrap{padding:22px 16px 38px}.shell{max-width:1000px}.hero{position:relative;padding:17px 0 23px}
.hero:before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);width:min(650px,90vw);height:150px;background:radial-gradient(ellipse,rgba(48,136,220,.13),transparent 72%);z-index:-1}
.logo{height:120px;width:125px;padding:12px 21px;background:#fff;object-fit:contain;border:1px solid #e5edf6;border-radius:22px;box-shadow:0 10px 30px rgba(20,70,118,.075)}
h1{font-size:36px;font-weight:760;letter-spacing:-.04em}.sub{font-size:13px;margin:9px auto 0;max-width:690px}
.top-actions{margin-top:17px}.btn{border-radius:12px;font-weight:700;font-size:13px;padding:11px 19px}
.panel{border-radius:22px;padding:26px 27px;box-shadow:0 14px 34px rgba(20,65,110,.065)}.steps{font-size:12px}
.card-title{font-size:17px;font-weight:740;letter-spacing:-.02em;margin-bottom:16px}
.choice-grid{gap:13px}.choice{border-radius:15px;padding:20px 18px 18px;min-height:100px;position:relative;overflow:hidden;box-shadow:none}
.choice:before{content:"";position:absolute;top:0;bottom:0;left:0;width:4px;background:#2c89d0}
.choice:nth-child(2):before{background:#8b76db}.choice:nth-child(3):before{background:#1aa080}.choice:nth-child(4):before{background:#ed9b37}
.choice b{font-size:15px;font-weight:720;margin-bottom:7px}.choice span{font-size:12px;color:#718398}
.choice:hover{background:#f9fcff;transform:translateY(-2px);box-shadow:0 9px 18px rgba(20,70,118,.08)}
.choice.active{background:#edf6fe;box-shadow:0 0 0 2px rgba(28,112,187,.1)}
.field label{font-size:12px;font-weight:650}input,textarea,select{border-radius:11px;font-size:13px}.notice{font-size:12px}
.bottom-links{margin-top:20px}.bottom-links a[href="index.html"]{display:none!important}
@media(max-width:760px){.panel{padding:19px 16px}.logo{width:100px;height:105px}.hero{padding-top:7px}.choice{min-height:auto}.choice b{font-size:14px}h1{font-size:30px}}

</style>

    <h1>e-Kaunter PKPJ</h1>
    <p class="sub">Portal orang awam untuk pengemaskinian maklumat dan dokumen secara digital. Semua permohonan tertakluk kepada semakan pegawai PKPJ.</p>
    <div class="top-actions">
      <button class="btn btn-primary" onclick="renderPublic('form')">Urusan Baharu</button>
      <button class="btn btn-light" onclick="renderPublic('status')">Semak Status</button>
    </div>
  </header>
  <section class="panel" id="panel"></section>
  <div class="bottom-links"><span class="pill">Membangun, Melindungi, Menyejahtera</span></div>
</div></div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzmhN2oSMT8ZYUj-H_Wf9d3ci1U5TRsPOpw-tPyQcBRWFy_8zzURVAx1OwPiw-A5lHUJw/exec";
const PURPOSES = [
  {id:'kahwin',name:'Pengemaskinian Status Perkahwinan',desc:'Kemaskini maklumat status perkahwinan'},
  {id:'pasangan',name:'Pengemaskinian Maklumat Pasangan',desc:'Kemaskini maklumat pasangan / tanggungan'},
  {id:'pendapatan',name:'Pengemaskinian Pekerjaan / Pendapatan',desc:'Kemaskini pekerjaan atau pendapatan'},
  {id:'lain',name:'Lain-lain Urusan / Dokumen Sokongan',desc:'Dokumen tambahan dan urusan lain-lain'}
];
const STATUS = {new:{label:'Baharu',cls:'warn'},review:{label:'Dalam Semakan',cls:'info'},incomplete:{label:'Dokumen Tidak Lengkap',cls:'warn'},updating:{label:'Sedang Dikemaskini',cls:'info'},done:{label:'Selesai',cls:'success'},reject:{label:'Ditolak',cls:'danger'}};
let CONFIG = {apiUrl:API_URL,maxFileBytes:4*1024*1024,maxFiles:5,hybridMinutes:120};
let STATE = {purpose:''};
const $ = id => document.getElementById(id);
const esc = (v='') => String(v).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
const fmt = v => !v ? '-' : new Intl.DateTimeFormat('ms-MY',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}).format(new Date(v));
const bytes = v => !v ? '0 B' : (()=>{const k=1024,s=['B','KB','MB'];const i=Math.min(2,Math.floor(Math.log(v)/Math.log(k)));return (v/Math.pow(k,i)).toFixed(i?1:0)+' '+s[i];})();
const UPLOAD_TOKEN = new URLSearchParams(location.search).get('upload') || '';
async function api(action,...args){ const r=await fetch(CONFIG.apiUrl,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,args})}); if(!r.ok) throw new Error('API tidak dapat dihubungi.'); const raw=await r.text(); let out; try{out=JSON.parse(raw)}catch(e){throw new Error('Respons API bukan JSON.')} if(out.success===false) throw new Error(out.error||out.message||'Ralat API'); if(out.success===true) return out.data; if(out.ok===true) return out.data ?? out; return out.data ?? out; }
async function fileToBase64(file){ return new Promise((resolve,reject)=>{const fr=new FileReader(); fr.onload=()=>resolve(String(fr.result).split(',')[1]||''); fr.onerror=()=>reject(new Error('Gagal membaca fail.')); fr.readAsDataURL(file);}); }
async function filesPayload(input){ const files=Array.from(input?.files||[]); if(!files.length) return []; if(files.length>CONFIG.maxFiles) throw new Error('Maksimum '+CONFIG.maxFiles+' fail.'); const out=[]; for(const f of files){ if(f.size>CONFIG.maxFileBytes) throw new Error(f.name+' melebihi had '+bytes(CONFIG.maxFileBytes)); out.push({name:f.name,mimeType:f.type||'application/octet-stream',size:f.size,base64:await fileToBase64(f)}); } return out; }
function previewFiles(input,targetId){ const files=Array.from(input.files||[]); $(targetId).innerHTML = files.map(f=>`<div class="doc"><div><b>${esc(f.name)}</b><div class="tiny" style="color:#75869a;margin-top:4px">${bytes(f.size)} · ${esc(f.type||'fail')}</div></div></div>`).join('') || '<div class="tiny" style="color:#75869a">Tiada fail dipilih.</div>'; }
function choiceGrid(){ return `<div class="choice-grid">${PURPOSES.map(p=>`<button type="button" class="choice ${STATE.purpose===p.id?'active':''}" onclick="STATE.purpose='${p.id}'; renderPublic('form')"><b>${esc(p.name)}</b><span>${esc(p.desc)}</span></button>`).join('')}</div>`; }
function renderPublic(tab='form'){ const panel=$('panel'); if(tab==='status') return renderStatus(); panel.innerHTML = `<div class="steps"><span><b>1.</b> Pilih Tujuan Urusan</span><span>Langkah 1/3</span></div><div class="card-title"><span>Pilih Tujuan Urusan</span></div>${choiceGrid()}<div class="notice warn" style="margin-top:16px">Penghantaran melalui sistem ini tidak bermaksud pindaan telah diluluskan. Semua maklumat tertakluk kepada semakan pegawai PKPJ.</div>${STATE.purpose?formBlock():''}`; }
function formBlock(){ return `<div style="margin-top:20px"><div class="steps"><span><b>2.</b> Isi Maklumat Pemohon</span><span>Langkah 2/3</span></div><div class="grid g2"><div class="field"><label class="req">No. Kad Pengenalan</label><input id="p_ic" inputmode="numeric"></div><div class="field"><label class="req">Nama Pemohon</label><input id="p_name"></div><div class="field"><label class="req">Nombor Telefon</label><input id="p_phone"></div><div class="field"><label>No. Permohonan / No. Siri</label><input id="p_app"></div></div><div class="grid g2"><div class="field"><label>Maklumat Lama</label><textarea id="p_old"></textarea></div><div class="field"><label>Maklumat Baharu</label><textarea id="p_new"></textarea></div></div><div class="field"><label>Catatan / Huraian</label><textarea id="p_note"></textarea></div><div class="steps"><span><b>3.</b> Muat Naik Dokumen Sokongan</span><span>Langkah 3/3</span></div><div class="field"><label>Dokumen Sokongan (jika ada)</label><input id="p_docs" type="file" multiple accept=".pdf,.jpg,.jpeg,.png" onchange="previewFiles(this,'p_list')"></div><div id="p_list" class="doc-list"><div class="tiny" style="color:#75869a">Tiada fail dipilih.</div></div><label style="display:flex;align-items:flex-start;gap:10px;margin-top:14px"><input id="p_confirm" type="checkbox" style="width:auto;margin-top:2px"><span style="font-size:12px;color:#5f7186">Saya mengesahkan maklumat yang dihantar adalah benar.</span></label><div class="toolbar" style="margin-top:16px"><button class="btn btn-primary" onclick="submitPublic()">Hantar Permohonan</button><button class="btn btn-light" onclick="renderPublic('status')">Semak Status</button></div></div>`; }
async function submitPublic(){ try{ if(!STATE.purpose) return alert('Sila pilih tujuan urusan.'); const ic=$('p_ic').value.trim(), name=$('p_name').value.trim(), phone=$('p_phone').value.trim(); if(!ic||!name||!phone) return alert('Sila lengkapkan maklumat wajib.'); if(!$('p_confirm').checked) return alert('Sila tandakan pengesahan.'); const docs=await filesPayload($('p_docs')); const r=await api('submitPublicCase',{purpose:STATE.purpose,ic,name,phone,appNo:$('p_app').value.trim(),oldValue:$('p_old').value.trim(),newValue:$('p_new').value.trim(),note:$('p_note').value.trim(),docs}); $('panel').innerHTML = `<div class="card-title">Penghantaran Berjaya</div><div class="notice success">Maklumat berjaya dihantar. Sila simpan nombor rujukan di bawah untuk semakan status.</div><div class="ref">${esc(r.ref)}</div><div class="notice info">Tarikh: ${fmt(r.createdAt)}</div><div class="toolbar" style="margin-top:16px"><button class="btn btn-primary" onclick="STATE={purpose:''}; renderPublic('form')">Urusan Baharu</button><button class="btn btn-light" onclick="renderPublic('status')">Semak Status</button></div>`; }catch(e){ alert(e.message||e); } }
function renderStatus(){ $('panel').innerHTML = `<div class="card-title">Semakan Status Urusan</div><div class="grid g2"><div class="field"><label class="req">No. Rujukan</label><input id="s_ref" placeholder="PKPJ-KTR-2026..."></div><div class="field"><label class="req">No. Kad Pengenalan</label><input id="s_ic" inputmode="numeric"></div></div><div class="toolbar"><button class="btn btn-primary" onclick="checkStatus()">Semak Sekarang</button><button class="btn btn-light" onclick="renderPublic('form')">Kembali</button></div><div id="statusResult" style="margin-top:16px"></div>`; }
async function checkStatus(){ try{ const r=await api('getPublicCaseStatus',$('s_ref').value.trim(),$('s_ic').value.trim()); const c=r.case; $('statusResult').innerHTML = `<div class="notice ${STATUS[c.status]?.cls||'info'}"><b>${esc(c.ref)}</b><div style="margin-top:8px">Pemohon: <b>${esc(c.name)}</b></div><div>Jenis: <b>${esc(PURPOSES.find(x=>x.id===c.purpose)?.name||c.purpose)}</b></div><div>Status: <b>${esc(STATUS[c.status]?.label||c.status)}</b></div><div>Kemaskini Terakhir: <b>${fmt(c.updatedAt)}</b></div></div>`; }catch(e){ $('statusResult').innerHTML = `<div class="notice danger">${esc(e.message||e)}</div>`; } }
async function renderHybrid(token){ try{ const r=await api('getHybridCaseInfo',token),c=r.case; $('panel').innerHTML = `<div class="card-title">Muat Naik Dokumen Tambahan</div><div class="notice info">Rujukan: <b>${esc(c.ref)}</b> · QR tamat pada <b>${fmt(c.expiresAt)}</b></div><div class="grid g2" style="margin-top:14px"><div class="field"><label>Nama Pemohon</label><input value="${esc(c.name)}" disabled></div><div class="field"><label>No. Kad Pengenalan</label><input value="${esc(c.icMasked)}" disabled></div></div><div class="field"><label class="req">Pilih Dokumen</label><input id="h_docs" type="file" multiple accept=".pdf,.jpg,.jpeg,.png" onchange="previewFiles(this,'h_list')"></div><div id="h_list" class="doc-list"><div class="tiny" style="color:#75869a">Tiada fail dipilih.</div></div><div class="toolbar" style="margin-top:16px"><button class="btn btn-primary" onclick="submitHybrid('${esc(token)}')">Hantar Dokumen</button></div>`; }catch(e){ $('panel').innerHTML = `<div class="notice danger">${esc(e.message||e)}</div>`; } }
async function submitHybrid(token){ try{ const docs=await filesPayload($('h_docs')); if(!docs.length) return alert('Sila pilih sekurang-kurangnya satu dokumen.'); const r=await api('submitHybridDocuments',token,docs); $('panel').innerHTML = `<div class="card-title">Dokumen Berjaya Dihantar</div><div class="notice success">${r.count} dokumen berjaya dimuat naik.</div><div class="toolbar" style="margin-top:16px"><button class="btn btn-light" onclick="renderPublic('form')">Portal Awam</button></div>`; }catch(e){ alert(e.message||e); } }
async function boot(){ try{ const c=await api('getClientConfig'); CONFIG=Object.assign(CONFIG,c||{}); }catch(e){} if(UPLOAD_TOKEN) renderHybrid(UPLOAD_TOKEN); else renderPublic('form'); }
boot();
</script>
</body>
