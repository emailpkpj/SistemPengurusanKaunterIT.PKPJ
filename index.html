<html lang="ms">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e-Kaunter PKPJ</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root{
      --navy:#0b2a4a;--navy2:#123c68;--blue:#1769aa;--blue2:#0f5d9a;
      --bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#68778a;--line:#dce5ee;
      --green:#1f9d66;--orange:#f59e0b;--red:#d9534f;--purple:#7c3aed;
      --shadow:0 12px 30px rgba(13,42,74,.10);--radius:18px;
    }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
    button,input,select,textarea{font:inherit} button{cursor:pointer}.hidden{display:none!important}
    h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
    .topbar{height:76px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:40;box-shadow:0 8px 20px rgba(0,0,0,.12)}
    .brand{display:flex;align-items:center;gap:13px}.logo{width:46px;height:46px;border-radius:14px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900}.brand-title{font-weight:900;font-size:19px}.brand-sub{font-size:12px;opacity:.75;margin-top:3px}.top-actions{display:flex;align-items:center;gap:9px}.pill{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:9px 12px;font-size:12px}
    .layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 76px)}.sidebar{background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto}.content{padding:26px;max-width:1500px;width:100%;margin:0 auto}.side-title{font-size:11px;letter-spacing:.12em;color:#9aa7b7;font-weight:900;padding:0 10px 8px}.nav{width:100%;border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:12px;color:#415166;font-weight:800;display:flex;gap:10px;align-items:center;margin:3px 0}.nav:hover{background:#f2f6fa}.nav.active{background:#eaf3fb;color:var(--navy);box-shadow:inset 3px 0 0 var(--blue)}.side-note{margin-top:18px;padding:13px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;font-size:11px;color:#6f7f91;line-height:1.5}
    .page-title{font-size:28px;margin-bottom:5px}.page-sub{color:var(--muted);margin-bottom:22px}.grid{display:grid;gap:16px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:#fff;border:1px solid #e6edf4;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}.card-title{font-weight:900;font-size:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.kpi{background:#fff;border:1px solid #e5edf5;border-radius:16px;padding:18px;box-shadow:0 8px 22px rgba(13,42,74,.07)}.kpi .label{font-size:12px;color:#6d7b8d;font-weight:800}.kpi .value{font-size:30px;font-weight:900;color:var(--navy);margin-top:7px}.kpi .hint{font-size:11px;color:#97a4b4;margin-top:3px}
    .btn{border:0;border-radius:12px;padding:11px 16px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s}.btn:hover{transform:translateY(-1px)}.btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 7px 18px rgba(23,105,170,.2)}.btn-dark{background:var(--navy);color:#fff}.btn-light{background:#eff4f8;color:var(--navy);border:1px solid #dce6f0}.btn-green{background:var(--green);color:#fff}.btn-red{background:#feecec;color:#a82e2a;border:1px solid #f6cccc}.btn-sm{padding:8px 11px;font-size:12px;border-radius:10px}.btn-block{width:100%}
    .field{margin-bottom:14px}.field label{display:block;font-size:12px;color:#526173;font-weight:900;margin-bottom:7px}.req:after{content:" *";color:#d92d20}input,select,textarea{width:100%;border:1px solid #ced9e5;border-radius:11px;padding:11px 12px;background:#fff;color:#172033;outline:none}input:focus,select:focus,textarea:focus{border-color:#6ba4d3;box-shadow:0 0 0 3px rgba(23,105,170,.08)}textarea{min-height:90px;resize:vertical}input[type=file]{padding:8px;background:#f8fafc}.help{font-size:11px;color:#7b8797;margin-top:6px;line-height:1.45}.divider{height:1px;background:var(--line);margin:18px 0}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.grow{flex:1 1 240px}.status{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap}.s-draft{background:#eef2f7;color:#667085}.s-new{background:#fff2da;color:#9a6200}.s-review{background:#e7f1ff;color:#245da7}.s-incomplete{background:#f3eaff;color:#7c3aed}.s-done{background:#e7f8f0;color:#15734b}.s-reject{background:#fdeaea;color:#b42318}
    .table-wrap{overflow:auto;max-height:620px;border:1px solid #e5ebf2;border-radius:14px}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid #edf1f5;text-align:left;font-size:12px;vertical-align:top}th{background:#f8fafc;color:#6b7788;font-weight:900;position:sticky;top:0}tr:hover td{background:#fbfdff}
    .public-wrap{min-height:100vh;background:linear-gradient(180deg,#eaf4ff 0,#f7faff 38%,#f4f7fb 100%);padding:24px}.public-shell{max-width:760px;margin:0 auto}.public-head{text-align:center;padding:20px 0 18px}.public-logo{width:68px;height:68px;border-radius:20px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900;margin:0 auto 13px}.public-title{font-size:28px;font-weight:900;color:var(--navy);margin-bottom:6px}.public-sub{color:#637286;line-height:1.5}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{padding:16px;border:1px solid #dbe5ef;background:#fff;border-radius:15px;text-align:left;transition:.18s}.choice:hover{border-color:#8fb8da;box-shadow:0 8px 22px rgba(13,42,74,.08)}.choice.active{border-color:var(--blue);background:#edf6ff;box-shadow:0 0 0 3px rgba(23,105,170,.08)}.choice b{display:block;color:var(--navy);margin-bottom:4px}.choice span{font-size:11px;color:#708093}.notice{padding:13px 14px;border-radius:12px;background:#fff8e8;border:1px solid #f3dfad;color:#7f5d12;font-size:12px;line-height:1.5}.success-box{text-align:center;padding:28px 18px}.check{width:70px;height:70px;border-radius:50%;background:#e8f8f0;color:#198754;display:grid;place-items:center;margin:0 auto 15px;font-size:34px;font-weight:900}.ref-box{background:#f4f8fc;border:1px dashed #9db6cb;border-radius:14px;padding:16px;margin:15px 0;font-size:21px;font-weight:900;color:var(--navy)}
    .login-wrap{min-height:100vh;background:linear-gradient(135deg,var(--navy),#0f4779);display:grid;place-items:center;padding:24px}.login-card{width:min(450px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 30px 70px rgba(0,0,0,.28)}.login-mark{width:64px;height:64px;border-radius:18px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900;margin-bottom:17px}
    .case-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:18px}.case-ref{font-size:25px;font-weight:900;color:var(--navy)}.kv{display:grid;grid-template-columns:180px 1fr;gap:8px 14px;font-size:13px}.kv .k{color:#6b7788;font-weight:800}.kv .v{font-weight:800;color:#26364a;word-break:break-word}.oldnew{display:grid;grid-template-columns:1fr 55px 1fr;gap:12px;align-items:center}.data-box{padding:14px;border:1px solid #dce5ee;border-radius:12px;background:#f9fbfd;min-height:72px;white-space:pre-wrap}.data-box b{display:block;font-size:11px;color:#6b7788;margin-bottom:6px}.arrow{text-align:center;font-size:22px;color:var(--blue);font-weight:900}.doc-list{display:grid;gap:8px}.doc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid #dfe7ef;border-radius:11px;background:#fafcfe}.doc-name{font-size:12px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:430px}.audit{border-left:3px solid #c8d8e8;padding-left:15px;margin-left:7px}.audit-item{position:relative;padding:0 0 16px 5px}.audit-item:before{content:"";position:absolute;left:-23px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--blue);border:3px solid #eaf3fb}.audit-time{font-size:10px;color:#94a3b8;margin-bottom:3px}.audit-text{font-size:12px;font-weight:800;color:#3b4a5c}
    .modal-backdrop{position:fixed;inset:0;background:rgba(2,17,31,.58);z-index:100;display:grid;place-items:center;padding:20px}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 22px 60px rgba(0,0,0,.28);padding:22px}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.modal-close{border:0;background:#eef2f7;border-radius:9px;width:34px;height:34px;font-weight:900;color:#526173}#qrBox{display:flex;justify-content:center;padding:18px;background:#fff;border-radius:14px;border:1px solid var(--line);width:max-content;margin:14px auto}.urlbox{font-size:11px;word-break:break-all;padding:10px;background:#f8fafc;border:1px solid var(--line);border-radius:9px;color:#637286}
    .loader{position:fixed;inset:0;background:rgba(255,255,255,.78);z-index:200;display:grid;place-items:center}.loader-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 24px;box-shadow:var(--shadow);font-weight:900;color:var(--navy)}.spin{display:inline-block;width:18px;height:18px;border:3px solid #d9e6f1;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:9px}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:1000px){.layout{grid-template-columns:1fr}.sidebar{display:none}.content{padding:18px}.grid-4{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:700px){.grid-2,.grid-3,.grid-4,.choice-grid{grid-template-columns:1fr}.public-wrap{padding:14px}.topbar{padding:0 14px}.brand-sub{display:none}.content{padding:14px}.oldnew{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.kv{grid-template-columns:1fr}.page-title{font-size:23px}.doc-name{max-width:220px}}
  </style>
</head>
<body>
<div id="root"></div>
<div id="loader" class="loader hidden"><div class="loader-card"><span class="spin"></span><span id="loaderText">Memproses...</span></div></div>

<script>
const SERVER_INITIAL_MODE = '<?= initialMode ?>';
const SERVER_UPLOAD_TOKEN = '<?= initialUploadToken ?>';

const PURPOSES = [
  {id:'telefon',name:'Pengemaskinian Nombor Telefon',group:'Pengemaskinian Maklumat'},
  {id:'alamat',name:'Pengemaskinian Alamat',group:'Pengemaskinian Maklumat'},
  {id:'kahwin',name:'Pengemaskinian Status Perkahwinan',group:'Pengemaskinian Maklumat'},
  {id:'pasangan',name:'Pengemaskinian Maklumat Pasangan',group:'Pengemaskinian Maklumat'},
  {id:'pendapatan',name:'Pengemaskinian Pekerjaan / Pendapatan',group:'Pengemaskinian Maklumat'},
  {id:'tanggungan',name:'Pengemaskinian Maklumat Tanggungan',group:'Pengemaskinian Maklumat'},
  {id:'tambahdok',name:'Tambah Dokumen',group:'Dokumen'},
  {id:'gantidok',name:'Ganti Dokumen',group:'Dokumen'},
  {id:'dokkurang',name:'Dokumen Tidak Lengkap / Dokumen Tambahan',group:'Dokumen'},
  {id:'permohonan',name:'Pembetulan Maklumat Permohonan',group:'Permohonan'},
  {id:'semakan',name:'Semakan / Isu Permohonan',group:'Permohonan'},
  {id:'lain',name:'Lain-lain Urusan',group:'Lain-lain'}
];
const STATUS={draft:{label:'Draf',cls:'s-draft'},new:{label:'Baharu',cls:'s-new'},review:{label:'Dalam Semakan',cls:'s-review'},incomplete:{label:'Dokumen Tidak Lengkap',cls:'s-incomplete'},done:{label:'Selesai',cls:'s-done'},reject:{label:'Ditolak',cls:'s-reject'}};
let CONFIG={webAppUrl:'',maxFileBytes:4*1024*1024,maxFiles:5,hybridMinutes:120};
let STAFF={token:sessionStorage.getItem('pkpj_staff_token')||'',session:null};
let PUBLIC_STATE={purpose:'',docs:[]};
let CURRENT_CASES=[];

function esc(v=''){return String(v).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function fmtDateTime(v){if(!v)return '-';try{return new Intl.DateTimeFormat('ms-MY',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}).format(new Date(v))}catch(e){return v}}
function bytesToSize(bytes){if(!bytes)return '0 B';const k=1024,s=['B','KB','MB'];const i=Math.min(2,Math.floor(Math.log(bytes)/Math.log(k)));return(bytes/Math.pow(k,i)).toFixed(i?1:0)+' '+s[i]}
function purposeName(id){return PURPOSES.find(p=>p.id===id)?.name||id||'-'}
function statusHTML(s){const o=STATUS[s]||STATUS.new;return `<span class="status ${o.cls}">${o.label}</span>`}
function showLoader(text='Memproses...'){document.getElementById('loaderText').textContent=text;document.getElementById('loader').classList.remove('hidden')}
function hideLoader(){document.getElementById('loader').classList.add('hidden')}
function errMsg(e){return (e&&e.message)?e.message:String(e||'Ralat tidak diketahui.')}
function gas(name,...args){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args)})}
function appUrl(params={}){const base=CONFIG.webAppUrl||location.href.split('?')[0];const u=new URL(base);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));return u.toString()}
function go(params={}){location.href=appUrl(params)}
function handleSessionError(e){const m=errMsg(e);if(/sesi|log masuk/i.test(m)){sessionStorage.removeItem('pkpj_staff_token');STAFF={token:'',session:null};alert(m);renderLogin();return true}return false}

async function boot(){
  try{CONFIG={...CONFIG,...await gas('getClientConfig')}}catch(e){console.error(e)}
  if(SERVER_UPLOAD_TOKEN){return renderHybridUpload(SERVER_UPLOAD_TOKEN)}
  if(SERVER_INITIAL_MODE==='public')return renderPublic();
  if(STAFF.token){
    try{const r=await gas('validateSession',STAFF.token);if(r.ok){STAFF.session=r.session;return renderStaff('dashboard')}}catch(e){}
    sessionStorage.removeItem('pkpj_staff_token');STAFF.token='';
  }
  renderLogin();
}

/* ========================== PUBLIC ========================== */
function renderPublic(){
  document.getElementById('root').innerHTML=`<div class="public-wrap"><div class="public-shell"><div class="public-head"><div class="public-logo">PKPJ</div><div class="public-title">e-Kaunter PKPJ</div><div class="public-sub">Lengkapkan maklumat urusan dan muat naik dokumen sokongan melalui telefon anda.</div></div><div id="publicForm" class="card"></div></div></div>`;
  PUBLIC_STATE={purpose:'',docs:[]};renderPublicStep1();
}
function renderPublicStep1(){
  document.getElementById('publicForm').innerHTML=`<div class="card-title"><span>1. Pilih Tujuan Urusan</span><span class="small muted">Langkah 1/3</span></div><div class="choice-grid">${PURPOSES.map(p=>`<button class="choice ${PUBLIC_STATE.purpose===p.id?'active':''}" onclick="selectPurpose('${p.id}')"><b>${esc(p.name)}</b><span>${esc(p.group)}</span></button>`).join('')}</div><div class="divider"></div><div class="notice">Penghantaran melalui sistem ini tidak bermaksud pindaan telah diluluskan. Semua maklumat tertakluk kepada semakan pegawai PKPJ.</div><div style="text-align:right;margin-top:16px"><button class="btn btn-primary" onclick="publicNext1()">Seterusnya →</button></div>`
}
function selectPurpose(id){PUBLIC_STATE.purpose=id;renderPublicStep1()}
function publicNext1(){if(!PUBLIC_STATE.purpose)return alert('Sila pilih tujuan urusan.');renderPublicStep2()}
function renderPublicStep2(){
  document.getElementById('publicForm').innerHTML=`<div class="card-title"><span>2. Maklumat Pemohon</span><span class="small muted">Langkah 2/3</span></div><div class="field"><label class="req">No. Kad Pengenalan</label><input id="p_ic" inputmode="numeric" placeholder="Contoh: 900101011234"></div><div class="field"><label class="req">Nama Penuh</label><input id="p_name" placeholder="Nama seperti Kad Pengenalan"></div><div class="field"><label class="req">No. Telefon</label><input id="p_phone" inputmode="tel" placeholder="Contoh: 0123456789"></div><div class="field"><label>No. Permohonan / No. Siri (jika berkaitan)</label><input id="p_app" placeholder="Jika ada"></div><div class="divider"></div><div class="field"><label>Jenis Urusan</label><input value="${esc(purposeName(PUBLIC_STATE.purpose))}" disabled></div><div class="oldnew"><div class="field" style="margin:0"><label>Maklumat Lama / Semasa</label><textarea id="p_old" placeholder="Jika berkaitan"></textarea></div><div class="arrow">→</div><div class="field" style="margin:0"><label>Maklumat Baharu / Dimohon</label><textarea id="p_new" placeholder="Maklumat baharu atau pembetulan"></textarea></div></div><div class="field" style="margin-top:14px"><label>Catatan / Sebab</label><textarea id="p_note" placeholder="Terangkan ringkas tujuan atau isu"></textarea></div><div class="toolbar" style="justify-content:space-between;margin-top:16px"><button class="btn btn-light" onclick="renderPublicStep1()">← Kembali</button><button class="btn btn-primary" onclick="publicNext2()">Seterusnya →</button></div>`;
  setTimeout(fillPublicStep2,0);
}
function fillPublicStep2(){if(!PUBLIC_STATE.ic)return;document.getElementById('p_ic').value=PUBLIC_STATE.ic||'';document.getElementById('p_name').value=PUBLIC_STATE.name||'';document.getElementById('p_phone').value=PUBLIC_STATE.phone||'';document.getElementById('p_app').value=PUBLIC_STATE.appNo||'';document.getElementById('p_old').value=PUBLIC_STATE.oldValue||'';document.getElementById('p_new').value=PUBLIC_STATE.newValue||'';document.getElementById('p_note').value=PUBLIC_STATE.note||''}
function publicNext2(){const ic=p_ic.value.trim(),name=p_name.value.trim(),phone=p_phone.value.trim();if(!ic||!name||!phone)return alert('Sila lengkapkan No. Kad Pengenalan, Nama dan No. Telefon.');PUBLIC_STATE={...PUBLIC_STATE,ic,name,phone,appNo:p_app.value.trim(),oldValue:p_old.value.trim(),newValue:p_new.value.trim(),note:p_note.value.trim()};renderPublicStep3()}
function renderPublicStep3(){
  document.getElementById('publicForm').innerHTML=`<div class="card-title"><span>3. Dokumen & Pengesahan</span><span class="small muted">Langkah 3/3</span></div><div class="field"><label>Dokumen Sokongan</label><input id="p_docs" type="file" multiple accept=".pdf,.jpg,.jpeg,.png" onchange="previewFiles(this,'p_filelist')"><div class="help">Maksimum ${CONFIG.maxFiles} fail. Setiap fail maksimum ${bytesToSize(CONFIG.maxFileBytes)}. Format PDF/JPG/PNG.</div></div><div id="p_filelist" class="doc-list"></div><div class="divider"></div><label style="display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.5"><input id="p_confirm" type="checkbox" style="width:auto;margin-top:3px"><span>Saya mengesahkan bahawa maklumat dan dokumen yang dikemukakan adalah benar dan boleh digunakan oleh PKPJ bagi tujuan semakan urusan ini.</span></label><div class="toolbar" style="justify-content:space-between;margin-top:18px"><button class="btn btn-light" onclick="renderPublicStep2()">← Kembali</button><button class="btn btn-green" onclick="submitPublic()">Hantar Permohonan</button></div>`
}
function previewFiles(input,targetId){const list=Array.from(input.files||[]);document.getElementById(targetId).innerHTML=list.map(f=>`<div class="doc"><div class="doc-name">📎 ${esc(f.name)}</div><div class="tiny muted">${bytesToSize(f.size)}</div></div>`).join('')}
async function filesToPayload(input){
  const files=Array.from(input?.files||[]);if(files.length>CONFIG.maxFiles)throw new Error(`Maksimum ${CONFIG.maxFiles} dokumen bagi satu penghantaran.`);
  for(const f of files){if(f.size>CONFIG.maxFileBytes)throw new Error(`Fail ${f.name} melebihi had ${bytesToSize(CONFIG.maxFileBytes)}.`);if(!['application/pdf','image/jpeg','image/png'].includes(f.type))throw new Error(`Format fail tidak dibenarkan: ${f.name}`)}
  return Promise.all(files.map(f=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:f.name,mimeType:f.type,size:f.size,base64:String(r.result).split(',')[1]||''});r.onerror=reject;r.readAsDataURL(f)})));
}
async function submitPublic(){
  if(!p_confirm.checked)return alert('Sila tandakan pengesahan sebelum hantar.');
  try{showLoader('Menghantar maklumat dan dokumen...');const docs=await filesToPayload(p_docs);const payload={...PUBLIC_STATE,docs};const r=await gas('submitPublicCase',payload);document.getElementById('publicForm').innerHTML=`<div class="success-box"><div class="check">✓</div><h2>Maklumat Berjaya Dihantar</h2><p class="muted">Simpan nombor rujukan ini untuk urusan susulan.</p><div class="ref-box">${esc(r.ref)}</div><div class="small muted">${fmtDateTime(r.createdAt)}</div><div class="notice" style="margin-top:18px;text-align:left">Maklumat akan disemak oleh pegawai PKPJ. Perubahan dalam Sistem Perumahan Johor hanya dibuat selepas semakan.</div><button class="btn btn-primary" style="margin-top:18px" onclick="renderPublic()">Buat Urusan Baharu</button></div>`}catch(e){alert(errMsg(e))}finally{hideLoader()}
}

/* ======================= HYBRID UPLOAD ======================= */
async function renderHybridUpload(tk){
  document.getElementById('root').innerHTML=`<div class="public-wrap"><div class="public-shell"><div class="public-head"><div class="public-logo">PKPJ</div><div class="public-title">Muat Naik Dokumen</div><div class="public-sub">Dokumen akan dilampirkan terus kepada rekod urusan anda.</div></div><div id="hybridCard" class="card"><div style="text-align:center;padding:25px" class="muted">Memuatkan maklumat kes...</div></div></div></div>`;
  try{showLoader('Memeriksa QR...');const r=await gas('getHybridCaseInfo',tk);const c=r.case;hybridCard.innerHTML=`<div class="field"><label>Nama Pemohon</label><input value="${esc(c.name)}" disabled></div><div class="field"><label>No. Kad Pengenalan</label><input value="${esc(c.icMasked)}" disabled></div><div class="field"><label>No. Rujukan</label><input value="${esc(c.ref)}" disabled></div><div class="field"><label class="req">Pilih Dokumen</label><input id="h_docs" type="file" multiple accept=".pdf,.jpg,.jpeg,.png" onchange="previewFiles(this,'h_filelist')"><div class="help">Maksimum ${CONFIG.maxFiles} fail. Setiap fail maksimum ${bytesToSize(CONFIG.maxFileBytes)}.</div></div><div id="h_filelist" class="doc-list"></div><div class="notice" style="margin-top:15px">Pastikan dokumen jelas dan lengkap sebelum dihantar.</div><button class="btn btn-green btn-block" style="margin-top:16px" onclick="submitHybrid('${esc(tk)}')">Hantar Dokumen</button>`}catch(e){hybridCard.innerHTML=`<h2>Pautan Tidak Tersedia</h2><p class="muted">${esc(errMsg(e))}</p>`}finally{hideLoader()}
}
async function submitHybrid(tk){try{showLoader('Memuat naik dokumen...');const docs=await filesToPayload(h_docs);if(!docs.length)throw new Error('Sila pilih sekurang-kurangnya satu dokumen.');const r=await gas('submitHybridDocuments',tk,docs);hybridCard.innerHTML=`<div class="success-box"><div class="check">✓</div><h2>Dokumen Berjaya Dihantar</h2><p class="muted">${r.count} dokumen telah dilampirkan kepada kes ${esc(r.ref)}.</p></div>`}catch(e){alert(errMsg(e))}finally{hideLoader()}}

/* ============================ LOGIN ============================ */
function renderLogin(){document.getElementById('root').innerHTML=`<div class="login-wrap"><div class="login-card"><div class="login-mark">PKPJ</div><h2 style="margin-bottom:5px">Portal Dalaman e-Kaunter</h2><p class="muted">Log masuk untuk semakan dan pemprosesan kes.</p><div class="field"><label>ID Staff</label><input id="loginId" autocomplete="username" placeholder="ID staff"></div><div class="field"><label>PIN</label><input id="loginPin" type="password" autocomplete="current-password" placeholder="PIN"></div><button class="btn btn-primary btn-block" onclick="doLogin()">Log Masuk</button><div style="text-align:center;margin-top:17px"><button class="btn btn-light btn-sm" onclick="go({mode:'public'})">Buka Portal Awam</button></div></div></div>`}
async function doLogin(){try{showLoader('Log masuk...');const r=await gas('staffLogin',loginId.value.trim(),loginPin.value.trim());STAFF.token=r.token;STAFF.session=r.session;sessionStorage.setItem('pkpj_staff_token',r.token);renderStaff('dashboard')}catch(e){alert(errMsg(e))}finally{hideLoader()}}
async function logout(){try{if(STAFF.token)await gas('staffLogout',STAFF.token)}catch(e){}sessionStorage.removeItem('pkpj_staff_token');STAFF={token:'',session:null};renderLogin()}

/* ============================ STAFF ============================ */
function nav(id,icon,label,view){return `<button class="nav ${view===id?'active':''}" onclick="renderStaff('${id}')"><span>${icon}</span><span>${label}</span></button>`}
function renderStaff(view='dashboard'){
  if(!STAFF.token)return renderLogin();
  const s=STAFF.session||{name:'Staff PKPJ'};
  root.innerHTML=`<div><div class="topbar"><div class="brand"><div class="logo">PKPJ</div><div><div class="brand-title">e-Kaunter PKPJ</div><div class="brand-sub">Portal Dalaman Pengurusan Urusan Kaunter</div></div></div><div class="top-actions"><span class="pill">${esc(s.name)}</span><button class="pill" onclick="logout()">Log Keluar</button></div></div><div class="layout"><aside class="sidebar"><div class="side-title">MENU UTAMA</div>${nav('dashboard','▦','Dashboard',view)}${nav('newcase','＋','Urusan Baharu',view)}${nav('cases','☷','Senarai Kes',view)}${nav('review','◉','Dalam Semakan',view)}${nav('done','✓','Selesai',view)}${nav('audit','⌕','Arkib / Audit',view)}${nav('reports','▥','Laporan',view)}<div class="side-title" style="margin-top:18px">PAUTAN</div><button class="nav" onclick="go({mode:'public'})"><span>↗</span><span>Portal Awam</span></button><div class="side-note">QR Awam adalah kekal. QR Hybrid dijana khusus bagi satu kes dan tamat tempoh secara automatik.</div></aside><main class="content" id="staffContent"><div class="muted">Memuatkan...</div></main></div></div>`;
  if(view==='dashboard')viewDashboard();if(view==='newcase')viewNewCase();if(view==='cases')viewCases('all');if(view==='review')viewCases('review');if(view==='done')viewCases('done');if(view==='audit')viewAudit();if(view==='reports')viewReports();
}
async function viewDashboard(){try{showLoader('Memuatkan dashboard...');const r=await gas('getDashboardData',STAFF.token);const s=r.summary,ch=r.channelsToday;staffContent.innerHTML=`<h1 class="page-title">Dashboard</h1><p class="page-sub">Ringkasan urusan e-Kaunter dan tindakan semasa.</p><div class="grid grid-4"><div class="kpi"><div class="label">Urusan Hari Ini</div><div class="value">${s.today}</div><div class="hint">Semua saluran</div></div><div class="kpi"><div class="label">Baharu</div><div class="value">${s.new}</div><div class="hint">Belum diproses</div></div><div class="kpi"><div class="label">Dalam Semakan</div><div class="value">${s.review}</div><div class="hint">Sedang diproses</div></div><div class="kpi"><div class="label">Selesai</div><div class="value">${s.done}</div><div class="hint">Kes ditutup</div></div></div><div class="grid grid-2" style="margin-top:16px"><div class="card"><div class="card-title">Tindakan Pantas</div><div class="grid grid-2"><button class="btn btn-primary btn-block" onclick="renderStaff('newcase')">＋ Urusan Baharu</button><button class="btn btn-light btn-block" onclick="openPublicQR()">▣ Papar QR Awam</button><button class="btn btn-light btn-block" onclick="renderStaff('cases')">☷ Senarai Kes</button><button class="btn btn-light btn-block" onclick="renderStaff('audit')">⌕ Carian Audit</button></div></div><div class="card"><div class="card-title">Saluran Hari Ini</div>${channelBars(ch)}</div></div><div class="card" style="margin-top:16px"><div class="card-title"><span>Kes Terkini</span><button class="btn btn-light btn-sm" onclick="renderStaff('cases')">Lihat Semua</button></div>${casesTable(r.latest)}</div>`}catch(e){if(!handleSessionError(e))alert(errMsg(e))}finally{hideLoader()}}
function channelBars(ch){const total=Math.max(1,(ch.self||0)+(ch.assisted||0)+(ch.hybrid||0));return [['self','Self-Service'],['assisted','Staff Bantu Isi'],['hybrid','Hybrid']].map(([k,label])=>{const n=ch[k]||0,p=Math.round(n/total*100);return `<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:900"><span>${label}</span><span>${n}</span></div><div style="height:9px;background:#edf2f7;border-radius:999px;overflow:hidden;margin-top:6px"><div style="width:${p}%;height:100%;background:linear-gradient(90deg,#1769aa,#5aa7df)"></div></div></div>`}).join('')}

function viewNewCase(){staffContent.innerHTML=`<h1 class="page-title">Urusan Baharu</h1><p class="page-sub">Pilih cara pemohon melengkapkan urusan.</p><div class="grid grid-3"><div class="card"><div style="font-size:30px">📱</div><h3 style="margin:10px 0 7px">Pemohon Isi Sendiri</h3><p class="muted small">Papar QR awam. Pemohon isi maklumat dan muat naik dokumen sendiri.</p><button class="btn btn-primary btn-block" onclick="openPublicQR()">Papar QR Awam</button></div><div class="card"><div style="font-size:30px">👨‍💼</div><h3 style="margin:10px 0 7px">Staff Bantu Isi</h3><p class="muted small">Pegawai masukkan maklumat bagi pihak pemohon dan boleh upload dokumen dari PC.</p><button class="btn btn-dark btn-block" onclick="renderAssistedForm(false)">Buka Borang Staff</button></div><div class="card"><div style="font-size:30px">🔄</div><h3 style="margin:10px 0 7px">Hybrid</h3><p class="muted small">Staff isi maklumat asas, pemohon scan QR sementara untuk upload dokumen.</p><button class="btn btn-light btn-block" onclick="renderAssistedForm(true)">Mulakan Hybrid</button></div></div>`}
function renderAssistedForm(isHybrid){staffContent.innerHTML=`<div class="case-head"><div><h1 class="page-title">${isHybrid?'Urusan Hybrid':'Staff Bantu Isi'}</h1><p class="page-sub">${isHybrid?'Staff isi maklumat; pemohon upload dokumen melalui QR sementara.':'Lengkapkan borang berdasarkan maklumat yang dikemukakan pemohon.'}</p></div><button class="btn btn-light" onclick="viewNewCase()">← Kembali</button></div><div class="card"><div class="grid grid-2"><div class="field"><label class="req">No. Kad Pengenalan</label><input id="a_ic"></div><div class="field"><label class="req">Nama Penuh</label><input id="a_name"></div><div class="field"><label class="req">No. Telefon</label><input id="a_phone"></div><div class="field"><label>No. Permohonan / No. Siri</label><input id="a_app"></div></div><div class="field"><label class="req">Tujuan Urusan</label><select id="a_purpose"><option value="">-- Pilih --</option>${PURPOSES.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="oldnew"><div class="field" style="margin:0"><label>Maklumat Lama / Semasa</label><textarea id="a_old"></textarea></div><div class="arrow">→</div><div class="field" style="margin:0"><label>Maklumat Baharu / Dimohon</label><textarea id="a_new"></textarea></div></div><div class="field" style="margin-top:14px"><label>Catatan / Sebab</label><textarea id="a_note"></textarea></div>${isHybrid?'':`<div class="field"><label>Dokumen Sokongan</label><input id="a_docs" type="file" multiple accept=".pdf,.jpg,.jpeg,.png" onchange="previewFiles(this,'a_filelist')"><div id="a_filelist" class="doc-list" style="margin-top:8px"></div></div>`}<div class="divider"></div><label style="display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.5"><input id="a_confirm" type="checkbox" style="width:auto;margin-top:3px"><span>Saya mengesahkan maklumat ini telah dikemukakan atau disahkan oleh pemohon semasa urusan di kaunter.</span></label><div style="text-align:right;margin-top:18px"><button class="btn btn-green" onclick="submitAssisted(${isHybrid})">${isHybrid?'Simpan & Jana QR Dokumen':'Simpan & Hantar'}</button></div></div>`}
async function submitAssisted(isHybrid){const ic=a_ic.value.trim(),name=a_name.value.trim(),phone=a_phone.value.trim(),purpose=a_purpose.value;if(!ic||!name||!phone||!purpose)return alert('Sila lengkapkan maklumat wajib.');if(!a_confirm.checked)return alert('Sila tandakan pengesahan pegawai.');try{showLoader('Menyimpan kes...');const docs=isHybrid?[]:await filesToPayload(a_docs);const payload={ic,name,phone,purpose,appNo:a_app.value.trim(),oldValue:a_old.value.trim(),newValue:a_new.value.trim(),note:a_note.value.trim(),docs};const r=await gas('createStaffCase',STAFF.token,payload,isHybrid);if(isHybrid){openHybridQRByToken(r.id,r.ref,r.hybridToken,r.hybridExpiresAt)}else{await viewCase(r.id)}}catch(e){if(!handleSessionError(e))alert(errMsg(e))}finally{hideLoader()}}

function openPublicQR(){openQRModal('QR Portal Awam',appUrl({mode:'public'}),'Pemohon scan QR ini untuk membuka borang e-Kaunter PKPJ.')}
function openHybridQRByToken(caseId,ref,tk,expires){const url=appUrl({mode:'public',upload:tk});openQRModal(`QR Dokumen - ${ref}`,url,`Pemohon scan untuk upload dokumen. Tamat: ${fmtDateTime(expires)}`,()=>viewCase(caseId))}
async function refreshHybrid(caseId,ref){try{showLoader('Menjana QR baharu...');const r=await gas('refreshHybridToken',STAFF.token,caseId);openHybridQRByToken(caseId,ref,r.hybridToken,r.hybridExpiresAt)}catch(e){if(!handleSessionError(e))alert(errMsg(e))}finally{hideLoader()}}
function openQRModal(title,url,desc,onClose){const b=document.createElement('div');b.className='modal-backdrop';b.innerHTML=`<div class="modal"><div class="modal-head"><div><h3 style="margin:0">${esc(title)}</h3><div class="small muted" style="margin-top:4px">${esc(desc)}</div></div><button class="modal-close">×</button></div><div id="qrBox"></div><div class="urlbox">${esc(url)}</div><div style="text-align:center;margin-top:14px"><button id="copyUrl" class="btn btn-primary">Salin Pautan</button></div></div>`;document.body.appendChild(b);const close=()=>{b.remove();if(onClose)onClose()};b.querySelector('.modal-close').onclick=close;b.onclick=e=>{if(e.target===b)close()};b.querySelector('#copyUrl').onclick=async()=>{try{await navigator.clipboard.writeText(url);alert('Pautan disalin.')}catch(e){alert('Tidak dapat menyalin pautan.') }};const box=b.querySelector('#qrBox');if(window.QRCode)new QRCode(box,{text:url,width:230,height:230,colorDark:'#0b2a4a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});else box.innerHTML='<div class="notice">QR library gagal dimuat. Gunakan pautan di bawah.</div>'}

async function viewCases(filter='all'){staffContent.innerHTML=`<h1 class="page-title">${filter==='done'?'Kes Selesai':filter==='review'?'Dalam Semakan':'Senarai Kes'}</h1><p class="page-sub">Cari berdasarkan nama, IC, nombor rujukan, telefon atau nombor permohonan.</p><div class="card"><div class="toolbar"><input id="caseSearch" class="grow" placeholder="Cari nama / IC / no. rujukan / telefon / no. permohonan"><select id="caseStatus" style="max-width:210px"><option value="">Semua Status</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select><button class="btn btn-primary btn-sm" onclick="runCaseSearch('${filter}')">Cari</button><button class="btn btn-light btn-sm" onclick="exportCasesCSV()">Export CSV</button></div><div id="caseTableArea" class="muted small">Memuatkan...</div></div>`;await runCaseSearch(filter)}
async function runCaseSearch(filter){try{showLoader('Memuatkan rekod...');const q=document.getElementById('caseSearch')?.value||'',status=document.getElementById('caseStatus')?.value||'';const r=await gas('listCases',STAFF.token,{filter,q,status});CURRENT_CASES=r.cases;caseTableArea.innerHTML=casesTable(r.cases)}catch(e){if(!handleSessionError(e))alert(errMsg(e))}finally{hideLoader()}}
function casesTable(list){if(!list||!list.length)return `<div style="padding:30px;text-align:center" class="muted">Tiada rekod dijumpai.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Tarikh / Masa</th><th>No. Rujukan</th><th>Pemohon</th><th>Urusan</th><th>Saluran</th><th>Status</th><th>Pegawai</th><th></th></tr></thead><tbody>${list.map(c=>`<tr><td>${fmtDateTime(c.createdAt)}</td><td><b>${esc(c.ref)}</b></td><td><b>${esc(c.name)}</b><br><span class="tiny muted">${esc(c.ic)} · ${esc(c.phone)}</span></td><td>${esc(purposeName(c.purpose))}</td><td>${esc(c.sourceLabel||c.source)}</td><td>${statusHTML(c.status)}</td><td>${esc(c.assignedTo||'-')}</td><td><button class="btn btn-light btn-sm" onclick="viewCase('${esc(c.id)}')">Buka</button></td></tr>`).join('')}</tbody></table></div>`}

async function viewCase(id){try{showLoader('Memuatkan kes...');const r=await gas('getCaseDetail',STAFF.token,id);const c=r.case;staffContent.innerHTML=`<div class="case-head"><div><div class="case-ref">${esc(c.ref)}</div><div class="small muted">Dicipta ${fmtDateTime(c.createdAt)} · ${esc(c.sourceLabel)}</div></div><div>${statusHTML(c.status)}</div></div><div class="grid grid-2"><div><div class="card"><div class="card-title">Maklumat Pemohon</div><div class="kv"><div class="k">Nama</div><div class="v">${esc(c.name)}</div><div class="k">No. Kad Pengenalan</div><div class="v">${esc(c.ic)}</div><div class="k">No. Telefon</div><div class="v">${esc(c.phone)}</div><div class="k">No. Permohonan / Siri</div><div class="v">${esc(c.appNo||'-')}</div><div class="k">Jenis Urusan</div><div class="v">${esc(purposeName(c.purpose))}</div><div class="k">Saluran</div><div class="v">${esc(c.sourceLabel)}</div><div class="k">Staff Bantu</div><div class="v">${esc(c.staffHelper||'-')}</div></div></div><div class="card" style="margin-top:16px"><div class="card-title">Perubahan Dimohon</div><div class="oldnew"><div class="data-box"><b>MAKLUMAT LAMA / SEMASA</b>${esc(c.oldValue||'-')}</div><div class="arrow">→</div><div class="data-box"><b>MAKLUMAT BAHARU / DIMOHON</b>${esc(c.newValue||'-')}</div></div><div class="divider"></div><div class="small muted"><b>Catatan Pemohon</b></div><div style="margin-top:5px;font-size:13px;line-height:1.5;white-space:pre-wrap">${esc(c.note||'-')}</div></div><div class="card" style="margin-top:16px"><div class="card-title"><span>Dokumen Sokongan</span>${c.source==='hybrid'&&c.status!=='done'?`<button class="btn btn-light btn-sm" onclick="refreshHybrid('${esc(c.id)}','${esc(c.ref)}')">Jana QR Upload</button>`:''}</div>${renderDocs(c.docs)}</div></div><div><div class="card"><div class="card-title">Tindakan Pegawai</div><div class="field"><label>Pegawai Bertanggungjawab</label><input id="c_assign" value="${esc(c.assignedTo||'')}" placeholder="Nama pegawai"></div><div class="field"><label>Status Kes</label><select id="c_status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${c.status===k?'selected':''}>${v.label}</option>`).join('')}</select></div><div class="field"><label>Catatan Pegawai</label><textarea id="c_officer">${esc(c.officerNote||'')}</textarea></div><label style="display:flex;gap:10px;align-items:flex-start;font-size:12px"><input id="c_updated" type="checkbox" style="width:auto;margin-top:2px" ${c.systemUpdated?'checked':''}><span>Maklumat telah dikemaskini dalam Sistem Perumahan Johor</span></label><div class="toolbar" style="margin-top:16px"><button class="btn btn-primary" onclick="saveCaseAction('${esc(c.id)}')">Simpan Tindakan</button>${c.status!=='done'?`<button class="btn btn-green" onclick="completeCaseAction('${esc(c.id)}')">Selesaikan Kes</button>`:''}</div></div><div class="card" style="margin-top:16px"><div class="card-title">Audit Trail</div><div class="audit">${(c.audit||[]).slice().reverse().map(a=>`<div class="audit-item"><div class="audit-time">${fmtDateTime(a.time)} · ${esc(a.actor||'Sistem')}</div><div class="audit-text">${esc(a.text)}</div></div>`).join('')||'<div class="muted small">Tiada rekod audit.</div>'}</div></div></div></div><div style="margin-top:18px"><button class="btn btn-light" onclick="renderStaff('cases')">← Kembali ke Senarai Kes</button></div>`}catch(e){if(!handleSessionError(e))alert(errMsg(e))}finally{hideLoader()}}
function renderDocs(docs=[]){if(!docs.length)return `<div class="muted small">Tiada dokumen dilampirkan.</div>`;return `<div class="doc-list">${docs.map((d,i)=>`<div class="doc"><div><div class="doc-name">📎 ${esc(d.fileName)}</div><div class="tiny muted">${esc(d.mimeType||'fail')} · ${bytesToSize(Number(d.size)||0)} · ${esc(d.uploadedBy||'')}</div></div><a class="btn btn-light btn-sm" href="${esc(d.driveUrl)}" target="_blank" rel="noopener">Buka</a></div>`).join('')}</div>`}
async function saveCaseAction(id){try{showLoader('Menyimpan tindakan...');await gas('saveCaseAction',STAFF.token,{caseId:id,assignedTo:c_assign.value.trim(),status:c_status.value,officerNote:c_officer.value.trim(),systemUpdated:c_updated.checked});alert('Tindakan disimpan.');await viewCase(id)}catch(e){if(!handleSessionError(e))alert(errMsg(e))}finally{hideLoader()}}
async function completeCaseAction(id){if(!c_updated.checked&&!confirm('Maklumat belum ditandakan dikemaskini dalam Sistem Perumahan Johor. Teruskan tutup kes?'))return;try{showLoader('Menutup kes...');await gas('completeCase',STAFF.token,{caseId:id,assignedTo:c_assign.value.trim(),officerNote:c_officer.value.trim(),systemUpdated:c_updated.checked});await viewCase(id)}catch(e){if(!handleSessionError(e))alert(errMsg(e))}finally{hideLoader()}}

function viewAudit(){staffContent.innerHTML=`<h1 class="page-title">Arkib / Audit</h1><p class="page-sub">Semak sejarah urusan berdasarkan IC, nombor rujukan, nama atau nombor permohonan.</p><div class="card"><div class="toolbar"><input id="auditQ" class="grow" placeholder="No. IC / No. Rujukan / Nama / No. Permohonan"><button class="btn btn-primary" onclick="runAuditSearch()">Cari Rekod</button></div><div id="auditResult" class="muted small">Masukkan carian untuk melihat sejarah urusan.</div></div>`}
async function runAuditSearch(){const q=auditQ.value.trim();if(!q)return;try{showLoader('Mencari rekod...');const r=await gas('searchAudit',STAFF.token,q);auditResult.innerHTML=r.cases.length?`<div style="margin:10px 0 14px"><b>${r.cases.length}</b> rekod dijumpai.</div>${casesTable(r.cases)}`:'<div style="padding:20px;text-align:center">Tiada rekod dijumpai.</div>'}catch(e){if(!handleSessionError(e))alert(errMsg(e))}finally{hideLoader()}}

async function viewReports(){staffContent.innerHTML=`<h1 class="page-title">Laporan Ringkas</h1><p class="page-sub">Statistik rekod e-Kaunter.</p><div id="reportArea" class="muted">Memuatkan...</div>`;try{showLoader('Memuatkan laporan...');const r=await gas('getReportData',STAFF.token);const total=Math.max(1,r.total);reportArea.innerHTML=`<div class="grid grid-4"><div class="kpi"><div class="label">Jumlah Kes</div><div class="value">${r.total}</div></div><div class="kpi"><div class="label">Self-Service</div><div class="value">${r.sourceCounts.self||0}</div></div><div class="kpi"><div class="label">Staff Bantu Isi</div><div class="value">${r.sourceCounts.assisted||0}</div></div><div class="kpi"><div class="label">Hybrid</div><div class="value">${r.sourceCounts.hybrid||0}</div></div></div><div class="card" style="margin-top:16px"><div class="card-title">Jenis Urusan</div>${PURPOSES.map(p=>{const n=r.purposeCounts[p.id]||0,pc=Math.round(n/total*100);return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12px"><b>${esc(p.name)}</b><span>${n}</span></div><div style="height:9px;background:#edf2f7;border-radius:999px;overflow:hidden;margin-top:5px"><div style="height:100%;width:${pc}%;background:linear-gradient(90deg,#1769aa,#5aa7df)"></div></div></div>`}).join('')}</div>`}catch(e){if(!handleSessionError(e))alert(errMsg(e))}finally{hideLoader()}}

function exportCasesCSV(){if(!CURRENT_CASES.length)return alert('Tiada rekod untuk dieksport.');const rows=[['No Rujukan','Tarikh','Nama','IC','Telefon','No Permohonan/Siri','Jenis Urusan','Saluran','Status','Pegawai','Sistem Perumahan Dikemaskini']];CURRENT_CASES.forEach(c=>rows.push([c.ref,fmtDateTime(c.createdAt),c.name,c.ic,c.phone,c.appNo,purposeName(c.purpose),c.sourceLabel,STATUS[c.status]?.label||c.status,c.assignedTo,c.systemUpdated?'Ya':'Tidak']));const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eKaunter_PKPJ_Rekod.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

boot();
</script>
