<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>e-Kaunter PKPJ · Portal Staf</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--navy:#0d2f57;--navy2:#113b6d;--blue:#1973c9;--cyan:#1fa8c9;--gold:#f0c540;--bg:#f4f8fc;--card:#ffffff;--text:#122033;--muted:#6f7f92;--line:#dbe7f1;--green:#158f5b;--orange:#d88700;--red:#c43f3f;--purple:#6e5ad6;--soft:#eef5fb;--shadow:0 18px 40px rgba(10,47,87,.10);--radius:20px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
.hidden{display:none!important}.muted{color:var(--muted)}.tiny{font-size:11px}.small{font-size:12px}.strong{font-weight:800}
.topbar{position:sticky;top:0;z-index:60;height:80px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 12px 25px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:14px}.brand-logo{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:14px;padding:6px}.brand-title{font-size:24px;font-weight:900;line-height:1}.brand-sub{font-size:12px;opacity:.8;margin-top:4px}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top-pill{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);font-size:12px;color:#fff}.top-pill button{background:transparent;border:0;color:#fff;font-weight:800;padding:0}
.app{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 80px)}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:80px;height:calc(100vh - 80px);overflow:auto}
.side-group{margin-bottom:18px}.side-label{padding:0 10px 8px;font-size:11px;font-weight:900;color:#97a7ba;letter-spacing:.12em}
.nav-btn{width:100%;border:0;background:transparent;text-align:left;padding:13px 14px;border-radius:14px;display:flex;align-items:center;gap:12px;font-weight:800;color:#36506a;margin-bottom:6px;transition:.15s}.nav-btn:hover{background:#f2f7fb}.nav-btn.active{background:linear-gradient(135deg,#eaf4ff,#f6fbff);color:var(--navy);box-shadow:inset 3px 0 0 var(--blue)}.nav-ico{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:#f0f5fb;font-size:15px}
.side-card{margin-top:18px;padding:15px;border-radius:16px;background:linear-gradient(180deg,#f9fcff,#f3f8fd);border:1px solid var(--line)}.side-card h4{margin:0 0 8px;font-size:14px}.side-card p{margin:0 0 10px;line-height:1.5;font-size:12px;color:var(--muted)}
.content{padding:26px;max-width:1600px;width:100%;margin:0 auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}.page-title{font-size:31px;font-weight:900;margin:0 0 6px;color:var(--navy)}.page-sub{margin:0;color:var(--muted)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}.card h3,.card h4{margin-top:0}.card-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;font-weight:900;color:var(--navy);font-size:16px}
.hero-box{padding:22px;border-radius:24px;background:linear-gradient(135deg,#0e3a6b,#12508d 52%,#1b7eba);color:#fff;box-shadow:0 18px 36px rgba(12,52,95,.22)}.hero-box h2{margin:0 0 8px;font-size:26px}.hero-box p{margin:0;color:#d9e7f5;max-width:900px;line-height:1.6}
.kpi{padding:18px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 24px rgba(12,52,95,.06)}.kpi .label{font-size:12px;font-weight:900;color:#6f7f92}.kpi .value{font-size:32px;font-weight:900;color:var(--navy);margin-top:6px}.kpi .hint{font-size:11px;color:#97a6b8;margin-top:4px}
.kpi.blue{background:linear-gradient(180deg,#fff,#f5fbff)}.kpi.green{background:linear-gradient(180deg,#fff,#f5fff8)}.kpi.orange{background:linear-gradient(180deg,#fff,#fff8ef)}.kpi.purple{background:linear-gradient(180deg,#fff,#fbf8ff)}.kpi.red{background:linear-gradient(180deg,#fff,#fff6f6)}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}.btn:hover{transform:translateY(-1px)}.btn-primary{background:linear-gradient(135deg,var(--blue),#0f5fa7);color:#fff}.btn-light{background:#f1f6fb;color:var(--navy);border:1px solid var(--line)}.btn-dark{background:var(--navy);color:#fff}.btn-green{background:var(--green);color:#fff}.btn-orange{background:#fff3df;color:#925a00;border:1px solid #f0d9ac}.btn-red{background:#fff0ef;color:#a13030;border:1px solid #f0c7c7}.btn-sm{padding:8px 12px;font-size:12px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar .grow{flex:1 1 240px}
input,select,textarea{width:100%;border:1px solid #cfdcea;border-radius:12px;padding:11px 12px;background:#fff;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:#77b3e3;box-shadow:0 0 0 3px rgba(25,115,201,.08)}textarea{min-height:96px;resize:vertical}input[type=file]{padding:8px;background:#f8fbfe}
.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:900;color:#506176;margin-bottom:7px}.req::after{content:' *';color:#d92d20}
.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{padding:16px;border-radius:16px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:.15s}.choice:hover{border-color:#8cc0eb}.choice.active{border-color:var(--blue);background:#edf6ff;box-shadow:0 0 0 3px rgba(25,115,201,.08)}.choice b{display:block;color:var(--navy);margin-bottom:4px}.choice span{font-size:11px;color:#718194}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid #edf2f7;text-align:left;font-size:12px;vertical-align:top}th{background:#f7fafc;color:#718194;font-weight:900;position:sticky;top:0;z-index:1}tr:hover td{background:#fbfdff}
.status{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap}.s-new{background:#fff0cf;color:#9b6900}.s-review{background:#e7f1ff;color:#235eab}.s-incomplete{background:#f1eafe;color:#6c43b7}.s-updating{background:#dff7fb;color:#0e7487}.s-done{background:#e6f8ee;color:#17734b}.s-reject{background:#feeceb;color:#a12f2b}
.notice{padding:12px 13px;border-radius:14px;font-size:12px;line-height:1.6}.notice.info{background:#eef7ff;border:1px solid #cddff0;color:#2b5d84}.notice.warn{background:#fff8ea;border:1px solid #efddb2;color:#8a6200}.notice.success{background:#edf9f2;border:1px solid #c6e8d5;color:#176b42}.notice.danger{background:#fff0ef;border:1px solid #efcccc;color:#a13232}
.bar{height:10px;border-radius:999px;background:#edf2f7;overflow:hidden}.bar>div{height:100%;background:linear-gradient(135deg,var(--blue),var(--cyan));border-radius:999px}
.case-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}.case-ref{font-size:24px;font-weight:900;color:var(--navy)}.kv{display:grid;grid-template-columns:180px 1fr;gap:8px 14px;font-size:12px}.kv .k{color:#708093;font-weight:800}.kv .v{font-weight:700;color:#24384d;word-break:break-word}
.audit{border-left:3px solid #d7e3ef;padding-left:14px}.audit-item{position:relative;padding:0 0 16px 6px}.audit-item:before{content:'';position:absolute;left:-23px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:3px solid #ecf5ff}.audit-time{font-size:10px;color:#90a0b3;margin-bottom:3px}.audit-text{font-size:12px;font-weight:800;color:#3b4d61}
.doc-list{display:grid;gap:10px}.doc{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fbfdff}.doc-name{font-weight:800}
.metric{display:grid;gap:8px}.metric-item{padding:10px 0;border-bottom:1px solid #eef3f7}
.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.quick-btn{padding:16px;border-radius:16px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:12px;font-weight:900;color:var(--navy);cursor:pointer}.quick-btn:hover{background:#f7fbff}.quick-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#eef5fb;font-size:18px}
.ai-card{background:linear-gradient(135deg,#fffef7,#f8fcff);border:1px solid #e8eef5}.ai-chip{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900;background:#eef5ff;color:#1d5fb0}
.pagination{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.modal-backdrop{position:fixed;inset:0;display:none;place-items:center;background:rgba(4,20,38,.55);padding:18px;z-index:200}.modal-backdrop.show{display:grid}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;box-shadow:0 26px 60px rgba(0,0,0,.25);padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.modal-close{border:0;background:#eef3f7;border-radius:10px;width:36px;height:36px;font-weight:900}#qrBox{display:flex;justify-content:center;padding:18px;border-radius:18px;border:1px solid var(--line);background:#fff;margin:16px 0}
.loader{position:fixed;inset:0;display:none;place-items:center;background:rgba(255,255,255,.75);z-index:250}.loader.show{display:grid}.loader-card{background:#fff;padding:18px 22px;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow);font-weight:900;color:var(--navy)}.spin{display:inline-block;width:18px;height:18px;border:3px solid #dce8f2;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}
.mobile-toggle{display:none}
@media (max-width:1100px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-100%;top:80px;width:290px;z-index:70;transition:.25s;box-shadow:20px 0 40px rgba(0,0,0,.14)}body.menu-open .sidebar{left:0}.content{padding:18px}.mobile-toggle{display:inline-flex}.topbar{padding:0 14px}.brand-title{font-size:20px}.page-title{font-size:26px}.g5,.g4,.g3,.g2,.choice-grid,.quick-grid{grid-template-columns:1fr}.kv{grid-template-columns:1fr}th,td{font-size:11px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <button class="btn btn-light mobile-toggle" onclick="toggleMenu()">☰</button>
    <img class="brand-logo" src="logo-pkpj.png" alt="Logo PKPJ">
    <div>
      <div class="brand-title">e-Kaunter PKPJ</div>
      <div class="brand-sub">Portal Dalaman Pengurusan Urusan Kaunter</div>
    </div>
  </div>
  <div class="top-actions">
    <div class="top-pill">👤 <span id="staffLabel">Tetapkan Nama Pegawai</span></div>
    <button class="top-pill" onclick="setStaffName()">Tukar Nama</button>
    <a class="top-pill" href="public.html" target="_blank">Portal Awam</a>
  </div>
</div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-group">
      <div class="side-label">MENU UTAMA</div>
      <button class="nav-btn active" data-view="dashboard" onclick="go('dashboard',this)"><span class="nav-ico">📊</span>Dashboard</button>
      <button class="nav-btn" data-view="newcase" onclick="go('newcase',this)"><span class="nav-ico">➕</span>Urusan Baharu</button>
      <button class="nav-btn" data-view="cases" onclick="go('cases',this,'all')"><span class="nav-ico">📂</span>Senarai Kes</button>
      <button class="nav-btn" data-view="review" onclick="go('cases',this,'review')"><span class="nav-ico">📝</span>Dalam Semakan</button>
      <button class="nav-btn" data-view="unassigned" onclick="go('cases',this,'unassigned')"><span class="nav-ico">🧭</span>Belum Diagih</button>
      <button class="nav-btn" data-view="done" onclick="go('cases',this,'done')"><span class="nav-ico">✅</span>Selesai</button>
      <button class="nav-btn" data-view="audit" onclick="go('audit',this)"><span class="nav-ico">🗃️</span>Arkib / Audit</button>
      <button class="nav-btn" data-view="reports" onclick="go('reports',this)"><span class="nav-ico">📈</span>Laporan</button>
    </div>
    <div class="side-group">
      <div class="side-label">PAUTAN</div>
      <a class="nav-btn" href="public.html" target="_blank"><span class="nav-ico">🌐</span>Portal Awam</a>
      <a class="nav-btn" href="https://docs.google.com/spreadsheets/d/1o7iChc2zBLK7-X5fcDzbXxm-jmdl-zYo3EJSC7VfQOI/edit?gid=0#gid=0" target="_blank"><span class="nav-ico">🧾</span>Database Sheet</a>
    </div>
    <div class="side-card">
      <h4>PKPJ</h4>
      <p>Membangun, Melindungi, Menyejahtera.</p>
      <div class="tiny muted">Tiada login staf. Nama pegawai aktif digunakan untuk rekod audit setiap tindakan.</div>
    </div>
  </aside>
  <main class="content" id="content"></main>
</div>
<div class="modal-backdrop" id="modalWrap"><div class="modal" id="modal"></div></div>
<div class="loader" id="loader"><div class="loader-card"><span class="spin"></span><span id="loaderText">Memuatkan...</span></div></div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzmhN2oSMT8ZYUj-H_Wf9d3ci1U5TRsPOpw-tPyQcBRWFy_8zzURVAx1OwPiw-A5lHUJw/exec";
const SHEET_URL = "https://docs.google.com/spreadsheets/d/1o7iChc2zBLK7-X5fcDzbXxm-jmdl-zYo3EJSC7VfQOI/edit?gid=0#gid=0";
const PURPOSES = [
  {id:'kahwin',name:'Pengemaskinian Status Perkahwinan',group:'Pengemaskinian Maklumat'},
  {id:'pasangan',name:'Pengemaskinian Maklumat Pasangan',group:'Pengemaskinian Maklumat'},
  {id:'pendapatan',name:'Pengemaskinian Pekerjaan / Pendapatan',group:'Pengemaskinian Maklumat'},
  {id:'lain',name:'Lain-lain Urusan / Dokumen Sokongan',group:'Lain-lain'}
];
const STATUS = {new:{label:'Baharu',cls:'s-new'},review:{label:'Dalam Semakan',cls:'s-review'},incomplete:{label:'Dokumen Tidak Lengkap',cls:'s-incomplete'},updating:{label:'Sedang Dikemaskini',cls:'s-updating'},done:{label:'Selesai',cls:'s-done'},reject:{label:'Ditolak',cls:'s-reject'}};
let CONFIG = {apiUrl:API_URL,maxFileBytes:4*1024*1024,maxFiles:5,hybridMinutes:120};
let ACTIVE_STAFF = localStorage.getItem('pkpj_active_staff') || '';
let CURRENT_CASE_OPTIONS = {filter:'all',page:1,pageSize:50,q:'',status:'',source:'',assignedTo:''};
let CURRENT_REPORT = [];
let CURRENT_DASH = null;

const $ = id => document.getElementById(id);
const esc = (v='') => String(v).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
const purposeName = id => (PURPOSES.find(p=>p.id===id)||{name:id||'-'}).name;
const statusHTML = s => `<span class="status ${STATUS[s]?.cls||''}">${esc(STATUS[s]?.label||s||'-')}</span>`;
const fmt = v => !v ? '-' : new Intl.DateTimeFormat('ms-MY',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}).format(new Date(v));
const bytes = v => !v ? '0 B' : (()=>{const k=1024, s=['B','KB','MB']; const i=Math.min(2,Math.floor(Math.log(v)/Math.log(k))); return (v/Math.pow(k,i)).toFixed(i?1:0)+' '+s[i];})();
const todayISO = () => new Date().toISOString().slice(0,10);
function requireStaffName(){ if(!ACTIVE_STAFF){ setStaffName(); if(!ACTIVE_STAFF) throw new Error('Sila tetapkan nama pegawai dahulu.'); } return ACTIVE_STAFF; }
function setStaffName(){ const name = prompt('Masukkan nama pegawai aktif:', ACTIVE_STAFF||''); if(name===null) return; ACTIVE_STAFF = (name||'').trim(); localStorage.setItem('pkpj_active_staff', ACTIVE_STAFF); updateStaffLabel(); }
function updateStaffLabel(){ $('staffLabel').textContent = ACTIVE_STAFF || 'Tetapkan Nama Pegawai'; }
function toggleMenu(){ document.body.classList.toggle('menu-open'); }
function closeMenu(){ document.body.classList.remove('menu-open'); }
function setActiveNav(view){ document.querySelectorAll('.nav-btn[data-view]').forEach(b=>b.classList.toggle('active', b.dataset.view===view)); }
function showLoader(text='Memuatkan...'){ $('loaderText').textContent=text; $('loader').classList.add('show'); }
function hideLoader(){ $('loader').classList.remove('show'); }
function openModal(html){ $('modal').innerHTML = html; $('modalWrap').classList.add('show'); }
function closeModal(){ $('modalWrap').classList.remove('show'); $('modal').innerHTML=''; }
$('modalWrap').addEventListener('click', e=>{ if(e.target.id==='modalWrap') closeModal(); });
async function api(action,...args){
  const r = await fetch(CONFIG.apiUrl, {method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,args})});
  if(!r.ok) throw new Error('API tidak dapat dihubungi. HTTP '+r.status);
  const raw = await r.text();
  let out; try{ out = JSON.parse(raw); }catch(err){ throw new Error('Respons API bukan JSON. Pastikan Apps Script telah Deploy versi terkini.'); }
  if(out.success===false) throw new Error(out.error||out.message||'Ralat API');
  if(out.success===true) return out.data;
  if(out.ok===true) return out.data ?? out;
  if(out.data && out.ok!==false) return out.data;
  return out;
}
async function fileToBase64(file){ return new Promise((resolve,reject)=>{ const fr=new FileReader(); fr.onload=()=>resolve(String(fr.result).split(',')[1]||''); fr.onerror=()=>reject(new Error('Gagal membaca fail: '+file.name)); fr.readAsDataURL(file); }); }
async function filesPayload(input){ const files=Array.from(input?.files||[]); if(!files.length) return []; if(files.length>CONFIG.maxFiles) throw new Error('Maksimum '+CONFIG.maxFiles+' fail.'); const out=[]; for(const f of files){ if(f.size>CONFIG.maxFileBytes) throw new Error(f.name+' melebihi had '+bytes(CONFIG.maxFileBytes)); out.push({name:f.name,mimeType:f.type||'application/octet-stream',size:f.size,base64:await fileToBase64(f)}); } return out; }
function previewFiles(input,targetId){ const t=$(targetId); const files=Array.from(input.files||[]); t.innerHTML = files.map(f=>`<div class="doc"><div><div class="doc-name">📎 ${esc(f.name)}</div><div class="tiny muted">${bytes(f.size)} · ${esc(f.type||'fail')}</div></div></div>`).join('') || '<div class="tiny muted">Tiada fail dipilih.</div>'; }
function metricBar(label,n,total){ const p = Math.round((n/Math.max(1,total))*100); return `<div class="metric-item"><div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:6px"><b>${esc(label)}</b><span>${n}</span></div><div class="bar"><div style="width:${p}%"></div></div></div>`; }
function casesTable(cases){ if(!cases.length) return '<div style="padding:30px;text-align:center" class="muted">Tiada rekod.</div>'; return `<div class="table-wrap"><table><thead><tr><th>Tarikh</th><th>No. Rujukan</th><th>Pemohon</th><th>Urusan</th><th>Saluran</th><th>Status</th><th>Pegawai</th><th></th></tr></thead><tbody>${cases.map(c=>`<tr><td>${fmt(c.createdAt)}</td><td><b>${esc(c.ref)}</b><div class="tiny muted">${esc(c.appNo||'-')}</div></td><td><b>${esc(c.name)}</b><div class="tiny muted">${esc(c.ic)} · ${esc(c.phone||'-')}</div></td><td>${esc(purposeName(c.purpose))}</td><td>${esc(c.sourceLabel||c.source||'-')}</td><td>${statusHTML(c.status)}</td><td>${esc(c.assignedTo||'-')}</td><td><button class="btn btn-light btn-sm" onclick="viewCase('${esc(c.id)}')">Buka</button></td></tr>`).join('')}</tbody></table></div>`; }
function renderDocs(d=[]){ if(!d.length) return '<div class="muted small">Tiada dokumen dilampirkan.</div>'; return `<div class="doc-list">${d.map(x=>`<div class="doc"><div><div class="doc-name">📎 ${esc(x.fileName)}</div><div class="tiny muted">${esc(x.mimeType||'fail')} · ${bytes(Number(x.size)||0)} · ${esc(x.uploadedBy||'')}</div></div><a class="btn btn-light btn-sm" href="${esc(x.driveUrl)}" target="_blank" rel="noopener">Buka</a></div>`).join('')}</div>`; }
function aiSummary(d){ if(!d) return '<div class="muted">AI belum mempunyai data.</div>'; const tips=[]; if(d.summary.unassigned>0) tips.push(`Terdapat <b>${d.summary.unassigned}</b> kes belum diagih. Agihkan segera kepada pegawai bertugas.`); if(d.summary.aging>0) tips.push(`Sebanyak <b>${d.summary.aging}</b> kes melebihi 3 hari. Utamakan kes-kes ini dahulu.`); if(d.summary.incomplete>0) tips.push(`Ada <b>${d.summary.incomplete}</b> kes dokumen tidak lengkap. Hubungi pemohon untuk tindakan susulan.`); if(!tips.length) tips.push('Operasi semasa berada dalam keadaan baik. Teruskan pemantauan berkala terhadap kes baharu .'); return `<div class="grid" style="gap:10px">${tips.map((t,i)=>`<div class="notice info"><b>Cadangan ${i+1}</b><div>${t}</div></div>`).join('')}</div>`; }
function renderShell(title,sub,extra=''){ return `<div class="page-head"><div><h1 class="page-title">${title}</h1><p class="page-sub">${sub}</p></div><div>${extra}</div></div>`; }
async function pageDashboard(){ closeMenu(); setActiveNav('dashboard'); showLoader('Memuatkan dashboard...'); try{ const d = await api('getDashboardData'); CURRENT_DASH = d; const s=d.summary; $('content').innerHTML = renderShell('Dashboard','Ringkasan operasi e-Kaunter PKPJ semasa.', `<div class="toolbar"><button class="btn btn-primary" onclick="go('newcase')">+ Urusan Baharu</button><a class="btn btn-light" href="public.html" target="_blank">Portal Awam</a></div>`) + `
<div class="hero-box"><h2>Pengurusan kaunter lebih kemas & tersusun</h2><p>Paparan ini memberi fokus kepada rekod urusan orang awam, semakan dokumen, agihan kes, dan analisis operasi secara lebih moden, ringkas dan mesra petugas.</p></div>
<div class="grid g5" style="margin-top:16px">

  <div class="kpi orange"><div class="label">Baharu</div><div class="value">${s.new}</div><div class="hint">Belum disemak</div></div>

</div>
<div class="grid g3" style="margin-top:16px">
  <div class="card"><div class="card-title">Tindakan Pantas</div><div class="quick-grid">
    <button class="quick-btn" onclick="go('newcase')"><span class="quick-ico">➕</span><span>Urusan Baharu</span></button>
    <a class="quick-btn" href="public.html" target="_blank"><span class="quick-ico">🌐</span><span>Portal Awam</span></a>
    <button class="quick-btn" onclick="go('cases',null,'unassigned')"><span class="quick-ico">🧭</span><span>Belum Diagih</span></button>
    <button class="quick-btn" onclick="go('audit')"><span class="quick-ico">🗃️</span><span>Carian Audit</span></button>
  </div></div>
  <div class="card"><div class="card-title">Saluran Hari Ini</div>
    ${metricBar('Self-Service', d.channelsToday.self||0, Math.max(1,s.today))}
    ${metricBar('Staff Bantu Isi', d.channelsToday.assisted||0, Math.max(1,s.today))}
    ${metricBar('Hybrid', d.channelsToday.hybrid||0, Math.max(1,s.today))}
  </div>
  <div class="card ai-card"><div class="card-title"><span>Pembantu AI Ringkas</span><span class="ai-chip">AUTO</span></div>${aiSummary(d)}</div>
</div>
<div class="grid g2" style="margin-top:16px">
  <div class="card"><div class="card-title">Perhatian Operasi</div>
    <div class="metric">${metricBar('Kes Terbuka', s.open, Math.max(1,s.open+s.doneToday))}${metricBar('Belum Diagih', s.unassigned, Math.max(1,s.open))}${metricBar('Lebih 3 Hari', s.aging, Math.max(1,s.open))}</div>
  </div>
  <div class="card"><div class="card-title">Maklumat Sistem</div>
    <div class="notice info"><b>Pegawai Aktif:</b> ${esc(ACTIVE_STAFF||'Belum ditetapkan')}</div>
    <div class="notice warn" style="margin-top:10px"><b>Perhatian:</b> Tiada login staf. Pastikan nama pegawai ditetapkan supaya rekod audit tersimpan dengan betul.</div>
  </div>
</div>
<div class="card" style="margin-top:16px"><div class="card-title">Kes Terkini <button class="btn btn-light btn-sm" onclick="go('cases')">Lihat Semua</button></div>${casesTable(d.latest||[])}</div>`; }catch(e){ $('content').innerHTML = renderShell('Dashboard','') + `<div class="notice danger">${esc(e.message||e)}</div>`; }finally{ hideLoader(); } }

function purposeChoices(selected=''){ return `<div class="choice-grid">${PURPOSES.map(p=>`<button type="button" class="choice ${selected===p.id?'active':''}" onclick="selectPurpose('${p.id}')"><b>${esc(p.name)}</b><span>${esc(p.group)}</span></button>`).join('')}</div>`; }
function selectPurpose(ev,id){ document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active')); if(ev && ev.currentTarget) ev.currentTarget.classList.add('active'); $('n_purpose').value=id; }
async function pageNewCase(){ closeMenu(); setActiveNav('newcase'); $('content').innerHTML = renderShell('Urusan Baharu','Bukaan kes dalaman untuk urusan dibantu pegawai atau kaedah hybrid.') + `
<div class="grid g2"><div class="card"><div class="card-title">Maklumat Pemohon</div>
<div class="field"><label class="req">Tujuan Urusan</label>${purposeChoices()}<input id="n_purpose" type="hidden"></div>

<div class="field"><label class="req">Nama Pemohon</label><input id="n_name" placeholder="Nama penuh pemohon"></div>
<div class="field"><label class="req">Nombor Telefon</label><input id="n_phone" placeholder="01XXXXXXXX"></div>
<div class="field"><label>No. Permohonan / No. Siri</label><input id="n_app" placeholder="Jika ada"></div>
<div class="grid g2"><div class="field"><label>Maklumat Lama</label><textarea id="n_old" placeholder="Contoh data lama"></textarea></div><div class="field"><label>Maklumat Baharu</label><textarea id="n_new" placeholder="Contoh data baharu"></textarea></div></div>
<div class="field"><label>Catatan Tambahan</label><textarea id="n_note" placeholder="Catatan ringkas untuk rujukan pegawai"></textarea></div>
</div>
<div class="card"><div class="card-title">Pilihan Pemprosesan</div>
<div class="notice info">Pilih sama ada pegawai memuat naik dokumen terus atau jana QR untuk pemohon memuat naik sendiri.</div>
<div class="field" style="margin-top:14px"><label>Mode</label><select id="n_mode" onchange="toggleHybridMode()"><option value="assisted">Staff Bantu Isi (dokumen terus dimuat naik)</option><option value="hybrid">Hybrid (jana QR untuk pemohon muat naik)</option></select></div>
<div id="assistedArea">
  <div class="field"><label>Dokumen Sokongan</label><input id="n_docs" type="file" multiple accept=".pdf,.jpg,.jpeg,.png" onchange="previewFiles(this,'n_filelist')"></div>
  <div id="n_filelist" class="doc-list"><div class="tiny muted">Tiada fail dipilih.</div></div>
</div>
<label style="display:flex;align-items:flex-start;gap:10px;margin-top:14px"><input type="checkbox" id="n_confirm" style="width:auto;margin-top:2px"><span class="small">Saya mengesahkan maklumat diisi dengan semakan pegawai.</span></label>
<div class="toolbar" style="margin-top:16px"><button class="btn btn-primary" onclick="submitNewCase()">Simpan Kes</button><button class="btn btn-light" onclick="pageDashboard()">Kembali</button></div>
</div></div>`; }
function toggleHybridMode(){ $('assistedArea').style.display = $('n_mode').value==='hybrid' ? 'none' : ''; }
async function submitNewCase(){ try{ requireStaffName(); const purpose=$('n_purpose').value; const ic=$('n_ic').value.trim(); const name=$('n_name').value.trim(); const phone=$('n_phone').value.trim(); if(!purpose||!ic||!name||!phone) return alert('Sila lengkapkan maklumat wajib dan pilih tujuan urusan.'); if(!$('n_confirm').checked) return alert('Sila tandakan pengesahan pegawai.'); const hybrid=$('n_mode').value==='hybrid'; showLoader('Menyimpan kes...'); const docs = hybrid ? [] : await filesPayload($('n_docs')); const payload = {ic,name,phone,purpose,appNo:$('n_app').value.trim(),oldValue:$('n_old').value.trim(),newValue:$('n_new').value.trim(),note:$('n_note').value.trim(),docs}; const r = await api('createStaffCase', ACTIVE_STAFF, payload, hybrid); if(hybrid){ const url = location.origin + location.pathname.replace(/[^/]+$/,'') + 'public.html?upload=' + encodeURIComponent(r.hybridToken); openModal(`<div class="modal-head"><div><h3 style="margin:0">QR Muat Naik Dokumen</h3><div class="muted small">No. Rujukan: <b>${esc(r.ref)}</b></div></div><button class="modal-close" onclick="closeModal()">×</button></div><div id="qrBox"></div><div class="notice info"><b>Tarikh tamat:</b> ${fmt(r.hybridExpiresAt)}</div><div class="small muted">Pautan: <div style="word-break:break-all;margin-top:6px">${esc(url)}</div></div>`); new QRCode($('qrBox'), {text:url,width:220,height:220}); } else { alert('Kes berjaya disimpan: '+r.ref); } pageDashboard(); }catch(e){ alert(e.message||e); } finally{ hideLoader(); } }

async function pageCases(filter='all'){ closeMenu(); setActiveNav(filter==='review'?'review':filter==='unassigned'?'unassigned':filter==='done'?'done':'cases'); CURRENT_CASE_OPTIONS.filter=filter; showLoader('Memuatkan senarai kes...'); try{ const r = await api('listCases', CURRENT_CASE_OPTIONS); $('content').innerHTML = renderShell('Senarai Kes','Carian dan semakan semua urusan e-Kaunter.') + `
<div class="card"><div class="toolbar">
  <input id="c_q" class="grow" placeholder="Cari nama, IC, no. rujukan, telefon, no. siri..." value="${esc(CURRENT_CASE_OPTIONS.q||'')}">
  <select id="c_status"><option value="">Semua Status</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${CURRENT_CASE_OPTIONS.status===k?'selected':''}>${v.label}</option>`).join('')}</select>
  <select id="c_source"><option value="">Semua Saluran</option><option value="self" ${CURRENT_CASE_OPTIONS.source==='self'?'selected':''}>Self-Service</option><option value="assisted" ${CURRENT_CASE_OPTIONS.source==='assisted'?'selected':''}>Staff Bantu Isi</option><option value="hybrid" ${CURRENT_CASE_OPTIONS.source==='hybrid'?'selected':''}>Hybrid</option></select>
  <button class="btn btn-primary" onclick="applyCaseFilters()">Cari</button>
  <button class="btn btn-light" onclick="resetCaseFilters()">Reset</button>
</div>${casesTable(r.cases||[])}<div class="pagination"><div class="small muted">Jumlah rekod: ${r.total} · Halaman ${r.page} / ${r.totalPages}</div><div class="toolbar"><button class="btn btn-light btn-sm" onclick="changePage(-1)" ${r.page<=1?'disabled':''}>Sebelum</button><button class="btn btn-light btn-sm" onclick="changePage(1)" ${r.page>=r.totalPages?'disabled':''}>Seterusnya</button></div></div></div>`; }catch(e){ $('content').innerHTML = renderShell('Senarai Kes','')+`<div class="notice danger">${esc(e.message||e)}</div>`; }finally{ hideLoader(); } }
function applyCaseFilters(){ CURRENT_CASE_OPTIONS.q=$('c_q').value.trim(); CURRENT_CASE_OPTIONS.status=$('c_status').value; CURRENT_CASE_OPTIONS.source=$('c_source').value; CURRENT_CASE_OPTIONS.page=1; pageCases(CURRENT_CASE_OPTIONS.filter); }
function resetCaseFilters(){ CURRENT_CASE_OPTIONS={filter:CURRENT_CASE_OPTIONS.filter,page:1,pageSize:50,q:'',status:'',source:'',assignedTo:''}; pageCases(CURRENT_CASE_OPTIONS.filter); }
function changePage(diff){ CURRENT_CASE_OPTIONS.page=Math.max(1,(CURRENT_CASE_OPTIONS.page||1)+diff); pageCases(CURRENT_CASE_OPTIONS.filter); }

async function viewCase(id){ closeMenu(); showLoader('Memuatkan rekod kes...'); try{ const r = await api('getCaseDetail', id); const c=r.case; const closed=['done','reject'].includes(c.status); $('content').innerHTML = renderShell('Butiran Kes','Paparan terperinci urusan pemohon.') + `
<div class="grid g2">
<div>
  <div class="card"><div class="case-head"><div><div class="case-ref">${esc(c.ref)}</div><div class="muted small">${fmt(c.createdAt)} · ${esc(c.sourceLabel||c.source||'-')}</div></div><div>${statusHTML(c.status)}</div></div>
  <div class="kv">
    <div class="k">Nama Pemohon</div><div class="v">${esc(c.name)}</div>
    <div class="k">No. Kad Pengenalan</div><div class="v">${esc(c.ic)}</div>
    <div class="k">Telefon</div><div class="v">${esc(c.phone||'-')}</div>
    <div class="k">Tujuan Urusan</div><div class="v">${esc(purposeName(c.purpose))}</div>
    <div class="k">No. Permohonan / Siri</div><div class="v">${esc(c.appNo||'-')}</div>
    <div class="k">Pegawai</div><div class="v">${esc(c.assignedTo||'-')}</div>
  </div>
  </div>
  <div class="card" style="margin-top:16px"><div class="card-title">Maklumat Perubahan</div>
    <div class="grid g2"><div><div class="small strong" style="margin-bottom:6px">Maklumat Lama</div><div class="notice info">${esc(c.oldValue||'-')}</div></div><div><div class="small strong" style="margin-bottom:6px">Maklumat Baharu</div><div class="notice info">${esc(c.newValue||'-')}</div></div></div>
    <div class="field" style="margin-top:14px"><label>Catatan Pemohon</label><div class="notice warn">${esc(c.note||'-')}</div></div>
  </div>
  <div class="card" style="margin-top:16px"><div class="card-title"><span>Dokumen Sokongan</span>${!closed?`<div class="toolbar"><button class="btn btn-light btn-sm" onclick="showUploadArea('${esc(c.id)}')">+ Dokumen</button><button class="btn btn-light btn-sm" onclick="refreshHybrid('${esc(c.id)}','${esc(c.ref)}')">QR Upload</button></div>`:''}</div>${renderDocs(c.docs||[])}<div id="staffUploadArea"></div></div>
  ${c.history?.length?`<div class="card" style="margin-top:16px"><div class="card-title">Sejarah Pemohon</div>${casesTable(c.history)}</div>`:''}
</div>
<div>
  <div class="card"><div class="card-title">Tindakan Pegawai</div>
    <div class="field"><label>Pegawai Bertanggungjawab</label><input id="d_assign" value="${esc(c.assignedTo||ACTIVE_STAFF)}"></div>
    <div class="field"><label>Status Kes</label><select id="d_status" ${closed?'disabled':''}>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${c.status===k?'selected':''}>${v.label}</option>`).join('')}</select></div>
    <div class="field"><label>Catatan Pegawai</label><textarea id="d_note" ${closed?'disabled':''}>${esc(c.officerNote||'')}</textarea></div>
    <label style="display:flex;align-items:flex-start;gap:10px"><input id="d_updated" type="checkbox" style="width:auto;margin-top:2px" ${c.systemUpdated?'checked':''} ${closed?'disabled':''}><span class="small">Maklumat telah dikemaskini dalam Sistem Perumahan Johor</span></label>
    ${!closed?`<div class="toolbar" style="margin-top:16px"><button class="btn btn-primary" onclick="saveCase('${esc(c.id)}')">Simpan Tindakan</button><button class="btn btn-green" onclick="finishCase('${esc(c.id)}')">Selesaikan Kes</button></div>`:`<div class="notice success" style="margin-top:14px">Kes ditutup ${c.completedAt?fmt(c.completedAt):''}${c.completedBy?' oleh '+esc(c.completedBy):''}.</div><button class="btn btn-orange" style="margin-top:12px" onclick="reopenCaseAction('${esc(c.id)}')">Buka Semula Kes</button>`}
  </div>
  <div class="card" style="margin-top:16px"><div class="card-title">Audit Trail</div><div class="audit">${(c.audit||[]).slice().reverse().map(a=>`<div class="audit-item"><div class="audit-time">${fmt(a.time)} · ${esc(a.actor||'Sistem')} · ${esc(a.action||'INFO')}</div><div class="audit-text">${esc(a.text)}</div></div>`).join('')||'<div class="muted small">Tiada audit.</div>'}</div></div>
</div>
</div>
<div style="margin-top:16px"><button class="btn btn-light" onclick="pageCases(CURRENT_CASE_OPTIONS.filter||'all')">← Kembali ke Senarai Kes</button></div>`; }catch(e){ $('content').innerHTML = renderShell('Butiran Kes','')+`<div class="notice danger">${esc(e.message||e)}</div>`; }finally{ hideLoader(); } }
function showUploadArea(id){ $('staffUploadArea').innerHTML = `<div class="field" style="margin-top:14px"><label>Tambah Dokumen oleh Pegawai</label><input id="staff_docs" type="file" multiple accept=".pdf,.jpg,.jpeg,.png" onchange="previewFiles(this,'staff_filelist')"></div><div id="staff_filelist" class="doc-list"><div class="tiny muted">Tiada fail dipilih.</div></div><button class="btn btn-green btn-sm" style="margin-top:10px" onclick="uploadStaffDocs('${esc(id)}')">Upload Dokumen</button>`; }
async function uploadStaffDocs(id){ try{ requireStaffName(); showLoader('Memuat naik dokumen...'); const docs = await filesPayload($('staff_docs')); if(!docs.length) throw new Error('Pilih dokumen dahulu.'); await api('addStaffDocuments', ACTIVE_STAFF, id, docs); await viewCase(id); }catch(e){ alert(e.message||e); }finally{ hideLoader(); } }
async function refreshHybrid(id,ref){ try{ requireStaffName(); showLoader('Menjana QR baharu...'); const r = await api('refreshHybridToken', ACTIVE_STAFF, id); const url = location.origin + location.pathname.replace(/[^/]+$/,'') + 'public.html?upload=' + encodeURIComponent(r.hybridToken); openModal(`<div class="modal-head"><div><h3 style="margin:0">QR Upload Dokumen</h3><div class="muted small">No. Rujukan: <b>${esc(ref)}</b></div></div><button class="modal-close" onclick="closeModal()">×</button></div><div id="qrBox"></div><div class="notice info"><b>Tarikh tamat:</b> ${fmt(r.hybridExpiresAt)}</div><div class="small muted">Pautan: <div style="word-break:break-all;margin-top:6px">${esc(url)}</div></div>`); new QRCode($('qrBox'), {text:url,width:220,height:220}); }catch(e){ alert(e.message||e); }finally{ hideLoader(); } }
async function saveCase(id){ try{ requireStaffName(); showLoader('Menyimpan tindakan...'); await api('saveCaseAction', ACTIVE_STAFF, {caseId:id,assignedTo:$('d_assign').value.trim(),status:$('d_status').value,officerNote:$('d_note').value.trim(),systemUpdated:$('d_updated').checked}); await viewCase(id); }catch(e){ alert(e.message||e); }finally{ hideLoader(); } }
async function finishCase(id){ try{ requireStaffName(); if(!$('d_updated').checked && !confirm('Maklumat belum ditandakan dikemaskini dalam Sistem Perumahan Johor. Teruskan?')) return; showLoader('Menutup kes...'); await api('completeCase', ACTIVE_STAFF, {caseId:id,assignedTo:$('d_assign').value.trim(),officerNote:$('d_note').value.trim(),systemUpdated:$('d_updated').checked}); await viewCase(id); }catch(e){ alert(e.message||e); }finally{ hideLoader(); } }
async function reopenCaseAction(id){ const reason = prompt('Sebab buka semula kes:','Semakan / tindakan lanjut'); if(reason===null) return; try{ requireStaffName(); showLoader('Membuka semula kes...'); await api('reopenCase', ACTIVE_STAFF, id, reason); await viewCase(id); }catch(e){ alert(e.message||e); }finally{ hideLoader(); } }

async function pageAudit(){ closeMenu(); setActiveNav('audit'); $('content').innerHTML = renderShell('Arkib / Audit','Cari sejarah urusan berdasarkan IC, rujukan, nama, telefon, no. siri atau pegawai.') + `<div class="card"><div class="toolbar"><input id="auditQ" class="grow" placeholder="Masukkan carian"><button class="btn btn-primary" onclick="runAudit()">Cari Rekod</button></div><div id="auditResult" class="muted small" style="margin-top:14px">Masukkan carian untuk melihat sejarah.</div></div>`; }
async function runAudit(){ const q=$('auditQ').value.trim(); if(!q) return; try{ showLoader('Mencari rekod...'); const r=await api('searchAudit', q); $('auditResult').innerHTML = r.cases.length ? `<div class="small muted" style="margin-bottom:10px">${r.cases.length} rekod dijumpai.</div>${casesTable(r.cases)}` : '<div style="padding:24px;text-align:center" class="muted">Tiada rekod dijumpai.</div>'; }catch(e){ $('auditResult').innerHTML=`<div class="notice danger">${esc(e.message||e)}</div>`; }finally{ hideLoader(); } }

async function pageReports(){ closeMenu(); setActiveNav('reports'); const d=new Date(); const from=new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10), to=todayISO(); $('content').innerHTML = renderShell('Laporan','Analisis urusan mengikut julat tarikh.') + `<div class="card"><div class="toolbar"><div class="field" style="margin:0"><label>Tarikh Dari</label><input id="r_from" type="date" value="${from}"></div><div class="field" style="margin:0"><label>Tarikh Hingga</label><input id="r_to" type="date" value="${to}"></div><button class="btn btn-primary" onclick="loadReport()">Jana Laporan</button><button class="btn btn-light" onclick="exportReportCSV()">Export CSV</button></div></div><div id="reportArea" style="margin-top:16px" class="muted">Memuatkan...</div>`; loadReport(); }
async function loadReport(){ try{ showLoader('Menjana laporan...'); const r = await api('getReportData', {dateFrom:$('r_from').value,dateTo:$('r_to').value,includeCases:false}); CURRENT_REPORT = r.cases||[]; const total=Math.max(1,r.total); $('reportArea').innerHTML = `
<div class="grid g4"><div class="kpi"><div class="label">Jumlah Kes</div><div class="value">${r.total}</div></div><div class="kpi"><div class="label">Self-Service</div><div class="value">${r.sourceCounts.self||0}</div></div><div class="kpi"><div class="label">Staff Bantu Isi</div><div class="value">${r.sourceCounts.assisted||0}</div></div><div class="kpi"><div class="label">Hybrid</div><div class="value">${r.sourceCounts.hybrid||0}</div></div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><div class="card-title">Status Kes</div>${Object.entries(STATUS).map(([k,v])=>metricBar(v.label,r.statusCounts[k]||0,total)).join('')}</div><div class="card"><div class="card-title">Jenis Urusan</div>${PURPOSES.map(p=>metricBar(p.name,r.purposeCounts[p.id]||0,total)).join('')}</div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><div class="card-title">Pegawai / Agihan Kes</div>${Object.entries(r.staffCounts||{}).sort((a,b)=>b[1]-a[1]).map(([n,v])=>metricBar(n,v,total)).join('')||'<div class="muted small">Tiada agihan.</div>'}</div><div class="card"><div class="card-title">Jumlah Mengikut Hari</div>${Object.entries(r.dailyCounts||{}).sort().slice(-31).map(([n,v])=>metricBar(n,v,total)).join('')||'<div class="muted small">Tiada rekod.</div>'}</div></div>`; }catch(e){ $('reportArea').innerHTML = `<div class="notice danger">${esc(e.message||e)}</div>`; }finally{ hideLoader(); } }
function csvDownload(rows,name){ const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'); const b=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function caseRows(a){ const rows=[['No Rujukan','Tarikh','Nama','IC','Telefon','No Permohonan/Siri','Jenis Urusan','Saluran','Status','Pegawai','Sistem Perumahan Dikemaskini']]; a.forEach(c=>rows.push([c.ref,fmt(c.createdAt),c.name,c.ic,c.phone,c.appNo,purposeName(c.purpose),c.sourceLabel,STATUS[c.status]?.label||c.status,c.assignedTo,c.systemUpdated?'Ya':'Tidak'])); return rows; }
async function exportReportCSV(){ try{ showLoader('Menyediakan laporan...'); const r = await api('getReportData', {dateFrom:$('r_from').value,dateTo:$('r_to').value,includeCases:true}); if(!r.cases.length) return alert('Tiada data laporan untuk dieksport.'); csvDownload(caseRows(r.cases),'eKaunter_PKPJ_Laporan.csv'); }catch(e){ alert(e.message||e); }finally{ hideLoader(); } }

function go(view, el=null, filter=null){ if(view==='dashboard') pageDashboard(); if(view==='newcase') pageNewCase(); if(view==='audit') pageAudit(); if(view==='reports') pageReports(); if(view==='cases') pageCases(filter||'all'); }
async function boot(){ updateStaffLabel(); try{ const c = await api('getClientConfig'); CONFIG = Object.assign(CONFIG, c||{}); }catch(e){} pageDashboard(); }
boot();
</script>
