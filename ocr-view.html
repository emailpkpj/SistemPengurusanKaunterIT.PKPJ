<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#11385e" />
  <title>Senarai OCR | Paparan Sahaja PKPJ</title>
  <style>
    :root{--navy:#123558;--navy2:#164b79;--blue:#176eae;--bg:#f4f7fb;--text:#17304a;--muted:#70869b;--line:#dfebf3;--white:#fff;--green:#147a57;--shadow:0 12px 32px rgba(18,53,88,.07)}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg);font-size:14px;line-height:1.5}
    button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}a{color:var(--blue)}
    .top{background:linear-gradient(112deg,#0d2f51,#18517e);color:#fff;padding:0 24px;height:76px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 9px 24px #0d294f20}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{height:48px;width:48px;object-fit:contain;background:#fff;padding:5px;border-radius:12px}
    .brand strong{display:block;font-size:19px;letter-spacing:-.035em}.brand small{display:block;font-size:11px;color:#d5e9fa;margin-top:0}
    .chip{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:#e7fbff;padding:7px 11px;background:#ffffff18;border:1px solid #ffffff35;border-radius:999px;white-space:nowrap;font-weight:750}
    .container{max-width:1190px;padding:25px 20px 64px;margin:0 auto}
    .head{display:flex;justify-content:space-between;align-items:flex-start;gap:13px;flex-wrap:wrap;margin-bottom:18px}
    h1{font-size:27px;letter-spacing:-.04em;color:#14385e;margin:0 0 6px}p{margin:0}.sub{font-size:13px;color:var(--muted)}
    .box{border:1px solid var(--line);border-radius:19px;background:#fff;box-shadow:var(--shadow);padding:19px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:39px;border-radius:10px;border:1px solid #d7e5f1;background:#f7fbff;color:#225178;font-weight:750;font-size:12px;padding:9px 13px;text-decoration:none}
    .btn:hover:not(:disabled){background:#edf6fc}.btn-primary{background:#166dab;color:white;border-color:#166dab}.btn-primary:hover:not(:disabled){background:#135e98}
    .btn-ghost{background:transparent}.btn-green{background:#eef9f5;color:#12694e;border-color:#c9e9db}
    .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:17px}.search{min-width:190px;flex:1;padding:12px 13px;border-radius:11px;border:1px solid #d1dfeb;background:#fff;outline:none}
    .search:focus{border-color:#70a8d1;box-shadow:0 0 0 3px #e3f3ff}
    .count{font-size:12px;color:#7890a8}.stats{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 14px}
    .table-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}table{border-collapse:collapse;width:100%;background:#fff}
    th,td{padding:13px 14px;text-align:left;border-bottom:1px solid #edf1f5;vertical-align:top;font-size:12px}th{background:#f6f9fd;color:#72889f;font-size:11px;text-transform:uppercase;letter-spacing:.045em;white-space:nowrap}
    tr:last-child td{border-bottom:0}tr:hover td{background:#fbfdff}.record-name{font-weight:750;color:#163a60;font-size:13px}.ref{font-weight:750;color:#2c5b7f;font-size:11px}
    .clip{color:#7990a3;font-size:11px;margin-top:3px;max-width:450px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-block;background:#eef4fb;border:1px solid #dfe9f3;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:800;color:#30628a}
    .badge.done{background:#e9f9ef;color:#11764c;border-color:#ccebd8}.badge.review{background:#fff6e5;color:#946006;border-color:#f5e6be}
    .mobile-list{display:none}.item{border:1px solid #dce8f1;border-radius:14px;padding:14px;margin:0 0 9px;background:#fff}.item-meta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:0 0 9px}.item h3{font-size:14px;color:#173d65;margin:0 0 6px}
    .pager{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:17px;flex-wrap:wrap}.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
    .record-head{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:18px}.meta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
    .meta{border:1px solid #dfebf3;border-radius:11px;background:#f8fbfe;padding:11px}.meta label{font-size:10px;color:#768ea5;display:block;font-weight:750;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}.meta b{font-size:12px;color:#1a3c5c}
    .section{border-top:1px solid #e7eff5;padding:15px 0}.section:first-of-type{border:0}.section h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;margin:0 0 8px;color:#306490}.section p{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
    .files{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:13px}.file{border:1px solid #dce7f0;border-radius:15px;background:#fff;overflow:hidden;min-width:0}
    .preview{height:190px;background:#f3f7fb;display:grid;place-items:center;position:relative;color:#7990a8;font-size:12px;overflow:hidden}
    .preview img{width:100%;height:100%;object-fit:contain;display:block}.pdfmark{text-align:center;font-weight:850;font-size:16px;color:#9a4351}.pdfmark span{display:block;font-size:39px;margin-bottom:8px}.preview-state{text-align:center}.preview-state>span{display:block;font-size:33px;margin-bottom:9px}
    .file-body{padding:12px}.file-title{font-size:12px;font-weight:800;color:#123d64;overflow-wrap:anywhere;min-height:20px}.file-name{font-size:10px;margin-top:4px;color:#8194a7;overflow-wrap:anywhere}.file-actions{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap}.file-actions .btn{font-size:11px;padding:7px 9px;min-height:34px}
    .notice{padding:13px 14px;border-radius:13px;border:1px solid #cadfee;background:#eff8ff;color:#295c80;font-size:12px;margin:10px 0}.error{background:#fff1f0;color:#a13a35;border-color:#efd2cb}
    .setup{max-width:560px;margin:30px auto}.setup h2{font-size:20px;margin:0 0 6px}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:800;color:#3c627d;margin-bottom:6px}.field input{width:100%;border:1px solid #cbdde9;padding:12px 13px;border-radius:11px}
    .foot{margin-top:22px;font-size:11px;color:#8b9cae;text-align:center}.empty{padding:38px 12px;text-align:center;color:#7b90a2}
    #toast{position:fixed;right:18px;bottom:18px;z-index:20;background:#133e64;color:white;max-width:340px;padding:11px 15px;border-radius:12px;box-shadow:0 12px 32px #1238;display:none;font-size:12px}
    @media(max-width:800px){.files{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:630px){.top{height:66px;padding:0 12px}.brand img{height:39px;width:39px}.brand strong{font-size:15px}.chip{font-size:9px;padding:6px 8px}.container{padding:16px 12px 40px}h1{font-size:22px}.box{padding:14px}.table-wrap{display:none}.mobile-list{display:block}.meta-grid{grid-template-columns:1fr}.files{grid-template-columns:1fr}.preview{height:220px}.file-actions .btn{flex:1}}
    @media print{.top,.toolbar,.btn,.pager,.foot,.file-actions,.notice{display:none!important}.container{padding:0}.box{border:none;box-shadow:none}.files{grid-template-columns:repeat(2,minmax(0,1fr))}.file{break-inside:avoid}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><img src="logo-pkpj.png" alt="Logo PKPJ"><div><strong>Paparan Semakan OCR</strong><small>Perbadanan Kemajuan Perumahan Johor</small></div></div><span class="chip">👁 PAPARAN SAHAJA</span></header>
  <main class="container" id="main"><div class="box"><p>Memuatkan Senarai OCR...</p></div></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
  'use strict';
  const $=id=>document.getElementById(id);
  const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=v=>{if(!v)return '-';const d=new Date(v);return isNaN(d.getTime())?esc(v):new Intl.DateTimeFormat('ms-MY',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}).format(d);};
  const state={api:'',key:'',page:1,query:'',items:[],total:0,totalPages:1,detail:null,mediaCache:new Map(),pageSize:40};
  let toastTimer;
  function toast(msg){const el=$('toast');el.textContent=msg;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.style.display='none';},3700);}
  function validateApi(url){try{const u=new URL(url);return u.protocol==='https:'&&u.hostname==='script.google.com'&&/\/macros\/s\/[^/]+\/exec\/?$/.test(u.pathname);}catch(e){return false;}}
  function urlConfig(){const h=new URLSearchParams(location.hash.replace(/^#/,''));const api=h.get('api')||'',key=h.get('key')||'';return {api,key};}
  function setConfig(){const c=urlConfig();if(validateApi(c.api)&&/^[a-fA-F0-9]{40,90}$/.test(c.key)){state.api=c.api;state.key=c.key;return true;}return false;}
  function makeLink(api,key){const u=new URL(location.href);u.hash=new URLSearchParams({api,key}).toString();return u.href;}
  function showSetup(error=''){
    $('main').innerHTML=`<section class="setup box"><h2>Sambungan Paparan OCR</h2><p class="sub">Tetapan sekali sahaja oleh pentadbir. Penerima pautan akan terus nampak Senarai OCR, tanpa skrin tetapan ini.</p>${error?`<div class="notice error">${esc(error)}</div>`:''}
      <div class="field"><label for="setupApi">URL Web App Paparan OCR (Baca Sahaja)</label><input id="setupApi" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" /></div>
      <div class="field"><label for="setupKey">Kunci Paparan OCR</label><input id="setupKey" type="password" autocomplete="off" placeholder="Nilai KUNCI_PAPARAN_OCR dari Apps Script" /></div>
      <div class="btnrow"><button class="btn btn-primary" id="setupConnect">Buka Senarai &amp; Jana Pautan</button></div><div class="notice" style="margin-top:18px">Kongsi pautan yang dijana hanya dengan penerima yang dibenarkan. Pautan ini memberikan akses membaca dan memuat turun lampiran OCR sahaja.</div></section>`;
    $('setupConnect').addEventListener('click',async()=>{
      const api=$('setupApi').value.trim(),key=$('setupKey').value.trim();
      if(!validateApi(api))return toast('URL Web App Apps Script tidak sah.');
      if(!/^[a-fA-F0-9]{40,90}$/.test(key))return toast('Kunci akses tidak sah.');
      location.hash=new URLSearchParams({api,key}).toString();state.api=api;state.key=key;state.page=1;try{await showList();}catch(e){showSetup(e.message||String(e));}
    });
  }
  async function api(action,props={}){
    if(!state.api||!state.key)throw new Error('Pautan paparan OCR belum disediakan.');
    const result=await fetch(state.api,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,key:state.key},props))});
    if(!result.ok)throw new Error('API tidak dapat dihubungi (HTTP '+result.status+').');
    let body;try{body=await result.json();}catch(e){throw new Error('Respons bukan JSON. Semak Web App URL dan deployment.');}
    if(body.success===false)throw new Error(body.error||'Akses gagal.');
    return body.data;
  }
  function statusBadge(s){const t=String(s||'-');return `<span class="badge ${t==='Selesai'?'done':t==='Dalam Semakan'?'review':''}">${esc(t)}</span>`;}
  function header(title,desc){return `<div class="head"><div><h1>${esc(title)}</h1><p class="sub">${esc(desc)}</p></div></div>`;}
  async function showList(){
    clearMedia();state.detail=null;
    $('main').innerHTML=header('Senarai Semakan OCR','Paparan rekod dan lampiran bukti • Baca sahaja')+`<div class="box"><div class="toolbar"><input type="search" id="search" class="search" placeholder="Cari no. rujukan, nama dokumen, kesalahan..." value="${esc(state.query)}" autocomplete="off"/><button class="btn" id="searchBtn">🔎 Cari</button></div><div id="recordsArea" aria-live="polite"><p class="sub">Memuatkan senarai rekod...</p></div></div><div class="foot">PKPJ · Membangun, Melindungi, Menyejahtera · Paparan OCR sahaja</div>`;
    $('searchBtn').addEventListener('click',()=>{state.query=$('search').value.trim();state.page=1;loadRecords();});
    $('search').addEventListener('keydown',e=>{if(e.key==='Enter'){state.query=e.target.value.trim();state.page=1;loadRecords();}});
    await loadRecords();
  }
  async function loadRecords(){
    const area=$('recordsArea');area.innerHTML='<p class="sub">Memuatkan Senarai OCR...</p>';
    try{
      const data=await api('list',{options:{query:state.query,page:state.page}});
      const records=Array.isArray(data.records)?data.records:[];state.items=records;state.total=Number(data.total)||0;state.totalPages=Number(data.totalPages)||1;
      const rows=records.map(r=>`<tr><td><div class="ref">${esc(r.ref)}</div><div class="clip">${fmt(r.createdAt)}</div></td><td><div class="record-name">${esc(r.documentName)}</div><div class="clip">${esc(r.errorDescription)}</div></td><td>${statusBadge(r.status)}</td><td>${Number(r.fileCount)||0} fail</td><td><button class="btn btn-primary open-record" data-id="${esc(r.id)}">Buka Rekod</button></td></tr>`).join('');
      const cards=records.map(r=>`<article class="item"><div class="item-meta"><span class="ref">${esc(r.ref)}</span>${statusBadge(r.status)}</div><h3>${esc(r.documentName)}</h3><p class="sub">${esc((r.errorDescription||'').slice(0,150))}</p><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px"><span class="count">${Number(r.fileCount)||0} lampiran • ${fmt(r.createdAt)}</span><button class="btn btn-primary open-record" data-id="${esc(r.id)}">Buka</button></div></article>`).join('');
      area.innerHTML=`<div class="stats"><b>${state.total} rekod OCR</b><span class="count">Halaman ${state.page} / ${state.totalPages}</span></div>`+(records.length?`<div class="table-wrap"><table><thead><tr><th>Rujukan / Tarikh</th><th>Dokumen &amp; Kesalahan</th><th>Status</th><th>Bukti</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><div class="mobile-list">${cards}</div>`:'<div class="empty">Tiada rekod OCR dijumpai.</div>')+`<div class="pager"><span class="count">${records.length} rekod dipaparkan</span><div class="btnrow"><button class="btn" id="prev" ${state.page<=1?'disabled':''}>← Sebelum</button><button class="btn" id="next" ${state.page>=state.totalPages?'disabled':''}>Seterusnya →</button></div></div>`;
      area.querySelectorAll('.open-record').forEach(b=>b.addEventListener('click',()=>showDetail(b.dataset.id)));
      $('prev').addEventListener('click',()=>{if(state.page>1){state.page--;loadRecords();window.scrollTo(0,0);}});
      $('next').addEventListener('click',()=>{if(state.page<state.totalPages){state.page++;loadRecords();window.scrollTo(0,0);}});
    }catch(e){area.innerHTML=`<div class="notice error">${esc(e.message||e)}</div><button class="btn" id="retry">Cuba Lagi</button>`;$('retry').addEventListener('click',loadRecords);}
  }
  function b64ToUrl(base64,mime){const binary=atob(base64);const chunk=64*1024;const parts=[];for(let i=0;i<binary.length;i+=chunk){const sub=binary.slice(i,i+chunk),arr=new Uint8Array(sub.length);for(let j=0;j<sub.length;j++)arr[j]=sub.charCodeAt(j);parts.push(arr);}return URL.createObjectURL(new Blob(parts,{type:mime||'application/octet-stream'}));}
  async function fileBlob(file){
    if(state.mediaCache.has(file.id))return state.mediaCache.get(file.id);
    const media=await api('media',{recordId:state.detail.record.id,fileId:file.id});
    if(!media.base64)throw new Error('Fail tidak dapat dibaca.');
    const mime=media.mimeType||file.mimeType||'application/octet-stream';
    const url=b64ToUrl(media.base64,mime);
    const result={url,mime,fileName:media.fileName||file.fileName};
    state.mediaCache.set(file.id,result);return result;
  }
  function clearMedia(){for(const item of state.mediaCache.values())URL.revokeObjectURL(item.url);state.mediaCache.clear();}
  async function download(file){
    try{const m=await fileBlob(file);const a=document.createElement('a');a.href=m.url;a.download=(file.fileName||m.fileName||'Bukti-OCR').replace(/[\\/:*?"<>|]/g,'_');a.style.display='none';document.body.appendChild(a);a.click();a.remove();toast('Fail dimuat turun: '+(file.title||file.fileName));}catch(e){toast('Gagal muat turun: '+(e.message||e));}
  }
  async function showPdf(file){
    // Buka tab hanya semasa klik untuk mengelak popup disekat.
    const tab=window.open('','_blank');if(!tab)return toast('Benarkan pop-up untuk membuka PDF.');
    try{tab.document.write('<title>Membuka PDF OCR</title><body style="font:14px system-ui;padding:28px">Memuatkan PDF...</body>');const m=await fileBlob(file);tab.location.href=m.url;}catch(e){tab.close();toast('Gagal buka PDF: '+(e.message||e));}
  }
  async function loadPreview(file){
    if(!String(file.mimeType||'').startsWith('image/'))return;
    const el=document.querySelector('.preview[data-file="'+CSS.escape(file.id)+'"]');if(!el||el.dataset.loaded)return;el.dataset.loaded='loading';
    try{const m=await fileBlob(file);if(!document.contains(el))return;const img=document.createElement('img');img.src=m.url;img.alt=file.title||file.fileName||'Gambar bukti';img.loading='lazy';el.replaceChildren(img);el.dataset.loaded='yes';}catch(e){el.textContent='Gagal memuatkan gambar';el.dataset.loaded='error';}
  }
  async function renderPreviews(start,number){
    const imgs=state.detail.files.filter(f=>String(f.mimeType||'').startsWith('image/'));
    const slice=imgs.slice(start,start+number);let cursor=0;
    async function worker(){while(cursor<slice.length){const ix=cursor++;await loadPreview(slice[ix]);}}
    await Promise.all([worker(),worker()]);
  }
  async function showDetail(id){
    clearMedia();state.detail=null;
    $('main').innerHTML=`<div class="btnrow" style="margin-bottom:15px"><button class="btn" id="back">← Kembali ke Senarai OCR</button></div><div class="box">Memuatkan butiran OCR...</div>`;
    $('back').addEventListener('click',showList);
    try{
      const data=await api('detail',{recordId:id});if(!data||!data.record)throw new Error('Rekod OCR tidak dijumpai.');
      state.detail={record:data.record,files:data.files||[]};const r=state.detail.record,files=state.detail.files;
      const blocks=files.map((f,i)=>{
        const isPdf=String(f.mimeType||'').toLowerCase()==='application/pdf';
        return `<div class="file" data-card="${esc(f.id)}"><div class="preview" data-file="${esc(f.id)}">${isPdf?'<div class="pdfmark"><span>📄</span>Dokumen PDF</div>':'<div class="preview-state"><span>🖼️</span><button class="btn load-single" data-id="'+esc(f.id)+'">Papar Gambar</button></div>'}</div><div class="file-body"><div class="file-title">${esc(f.title||'Bukti '+(i+1))}</div><div class="file-name">${esc(f.fileName||'Lampiran')} · ${Math.ceil((Number(f.size)||0)/1024)} KB</div><div class="file-actions">${isPdf?`<button class="btn btn-primary open-pdf" data-id="${esc(f.id)}">📄 Buka PDF</button>`:''}<button class="btn btn-green download" data-id="${esc(f.id)}">⬇ ${isPdf?'Muat Turun PDF':'Simpan Gambar'}</button></div></div></div>`;
      }).join('');
      $('main').innerHTML=`<div class="btnrow" style="margin-bottom:15px"><button class="btn" id="back">← Kembali ke Senarai OCR</button></div><div class="box"><div class="record-head"><span class="ref">${esc(r.ref)}</span><h1 style="margin:7px 0">${esc(r.documentName)}</h1><p class="sub">Rekod Semakan OCR · ${fmt(r.createdAt)}</p></div><div class="meta-grid"><div class="meta"><label>Status</label>${statusBadge(r.status)}</div><div class="meta"><label>Pegawai / Kaunter</label><b>${esc(r.officer||'-')}</b></div><div class="meta"><label>Kemaskini Terakhir</label><b>${fmt(r.updatedAt)}</b></div></div><div class="section"><h3>Kesalahan Dokumen</h3><p>${esc(r.errorDescription||'-')}</p></div><div class="section"><h3>Catatan</h3><p>${esc(r.notes||'-')}</p></div><div class="section"><h3>Catatan Tindakan</h3><p>${esc(r.followUpNotes||'-')}</p></div><div class="section"><h3>Gambar dan PDF Bukti (${files.length})</h3><p class="sub">Klik Simpan Gambar untuk memuat turun imej ke peranti sendiri. Lampiran PDF juga boleh dibuka atau dimuat turun.</p><div class="files" id="files">${blocks||'<div class="empty">Tiada lampiran direkodkan.</div>'}</div><div class="btnrow" style="margin-top:14px" id="moreRow"></div></div></div><div class="foot">PKPJ · Membangun, Melindungi, Menyejahtera · Paparan OCR sahaja</div>`;
      $('back').addEventListener('click',showList);
      document.querySelectorAll('.download').forEach(b=>b.addEventListener('click',()=>{const f=files.find(x=>x.id===b.dataset.id);if(f)download(f);}));
      document.querySelectorAll('.load-single').forEach(b=>b.addEventListener('click',()=>{const f=files.find(x=>x.id===b.dataset.id);if(f)loadPreview(f);}));
      document.querySelectorAll('.open-pdf').forEach(b=>b.addEventListener('click',()=>{const f=files.find(x=>x.id===b.dataset.id);if(f)showPdf(f);}));
      const images=files.filter(f=>String(f.mimeType||'').startsWith('image/'));
      const more=$('moreRow');let current=0;
      async function batch(){if(current>=images.length){more.replaceChildren();return;}const start=current;current=Math.min(images.length,current+12);more.innerHTML=`<span class="count">Memuatkan gambar ${start+1}-${current} daripada ${images.length}...</span>`;await renderPreviews(start,12);if(!state.detail||state.detail.record.id!==id)return;more.innerHTML=current<images.length?`<button class="btn" id="loadMore">Lihat ${Math.min(12,images.length-current)} Gambar Lagi (${current}/${images.length})</button>`:'';if($('loadMore'))$('loadMore').addEventListener('click',batch);}
      batch();window.scrollTo(0,0);
    }catch(e){$('main').insertAdjacentHTML('beforeend',`<div class="notice error">${esc(e.message||e)}</div>`);}
  }
  async function init(){
    if(setConfig()){try{await showList();}catch(e){showSetup(e.message||e);}}
    else showSetup();
  }
  window.addEventListener('hashchange',()=>{if(setConfig()){state.page=1;state.query='';clearMedia();showList();}else showSetup();});
  init();
  </script>
</body>
</html>
